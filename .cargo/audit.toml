# Cargo audit configuration
# See: https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
ignore = [
    # RUSTSEC-2023-0071: rsa timing side-channel (Marvin Attack)
    # Transitive dependency via sqlx-mysql -> rsa 0.9.x
    # No fix available upstream. Low risk: only applies to RSA PKCS#1 v1.5
    # decryption in MySQL TLS connections, requires attacker on same network.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2025-0052: async-std is unmaintained
    # Transitive dependency via pulsar 6.7.0 (optional, feature-gated).
    # No upstream fix: pulsar-rs has not released a version without async-std.
    "RUSTSEC-2025-0052",

    # RUSTSEC-2025-0141: bincode is unmaintained
    # Transitive dependency via iai-callgrind (dev-only benchmarking framework).
    # bincode is embedded in the benchmark runner; no alternative available.
    "RUSTSEC-2025-0141",

    # RUSTSEC-2026-0253: lru 0.16 `LruCache::pop()` not panic-safe if a key's
    # `Drop` panics. Transitive via aws-sdk-s3 1.128 (S3 Express identity
    # cache, keys without custom `Drop`). The patched lru (>=0.18.2) is only
    # pulled by aws-sdk-s3 >=1.144 (rust-version 1.94.1 > MSRV 1.93).
    # Mirrored from deny.toml.
    "RUSTSEC-2026-0253",

    # RUSTSEC-2026-0387: crypto-bigint 0.4 and 0.5 timing variability, fixed
    # only in >=0.7.6. Transitive via aws-sigv4 1.4 (`sigv4a`), behind the
    # optional `s3-state` feature, and run only for SigV4A (Multi-Region Access
    # Point and Outposts ARNs, or AWS_AUTH_SCHEME_PREFERENCE). aws-sigv4 >=1.6.4
    # moves to 0.7 but has rust-version 1.94.1 > MSRV 1.93. Mirrored from
    # deny.toml.
    "RUSTSEC-2026-0387",

    # RUSTSEC-2026-0441: pin-utils unmaintained, no patched release. Transitive
    # via aws-smithy-types, -runtime and -http (`pin_mut!` macro only), behind
    # the optional `s3-state` feature. Their releases without it have
    # rust-version 1.94.1 > MSRV 1.93. Mirrored from deny.toml.
    "RUSTSEC-2026-0441",

    # RUSTSEC-2026-0097: rand unsound with custom logger calling rand::rng()
    # during reseed. Preconditions (custom logger using rand::rng() with
    # trace/warn logging) don't apply to us — mirrored from deny.toml.
    "RUSTSEC-2026-0097",

    # quick-xml 0.26 attribute-parsing DoS advisories. Transitive via
    # inferno → pprof (dev-only profiling); inferno pins quick-xml 0.26,
    # fix requires >=0.41. Never parses attacker-controlled XML here.
    # Mirrored in deny.toml.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # RUSTSEC-2026-0173: proc-macro-error2 unmaintained. Dev-only
    # transitive via iai-callgrind-macros (benchmarks) — same tree as
    # the bincode ignore above. Mirrored in deny.toml.
    "RUSTSEC-2026-0173",

    # RUSTSEC-2024-0449: unsafe-libyaml unmaintained. Transitive via
    # serde_yaml 0.9, used only to parse a connectors credentials file;
    # leaves with `async-runtime` (ADR-008). Mirrored from deny.toml.
    "RUSTSEC-2024-0449",
]
