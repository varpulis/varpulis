# Cargo audit configuration
# See: https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
ignore = [
    # RUSTSEC-2023-0071: rsa timing side-channel (Marvin Attack)
    # Transitive dependency via sqlx-mysql -> rsa 0.9.x
    # No fix available upstream. Low risk: only applies to RSA PKCS#1 v1.5
    # decryption in MySQL TLS connections, requires attacker on same network.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2025-0052: async-std is unmaintained
    # Transitive dependency via pulsar 6.7.0 (optional, feature-gated).
    # No upstream fix: pulsar-rs has not released a version without async-std.
    "RUSTSEC-2025-0052",

    # RUSTSEC-2025-0141: bincode is unmaintained
    # Transitive dependency via iai-callgrind (dev-only benchmarking framework).
    # bincode is embedded in the benchmark runner; no alternative available.
    "RUSTSEC-2025-0141",

    # RUSTSEC-2025-0134: rustls-pemfile is unmaintained
    # Still pulled by async-nats 0.46.x. No upstream fix yet.
    "RUSTSEC-2025-0134",

    # RUSTSEC-2026-0049: rustls-webpki CRL distributionPoint bypass
    # Transitive via async-nats 0.46 which pins rustls-webpki 0.102.x.
    # Fix requires >=0.103.10. No upstream fix for async-nats yet.
    "RUSTSEC-2026-0049",

    # wasmtime 25.x: 11 CVEs published 2026-04-09. Transitive via
    # varpulis-wasm (WASM UDF SmartModule feature). wasmtime 26.x fixes
    # all of these but requires API migration. Already ignored in
    # deny.toml; mirrored here so `cargo audit` matches.
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
]
