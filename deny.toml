# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# ---------------------------------------------------------------------------
# Advisories — check for known vulnerabilities and unmaintained crates
# ---------------------------------------------------------------------------
[advisories]
# Fail on any vulnerability, but allow specific unmaintained crates that we've
# evaluated and accepted the risk for (transitive dependencies we can't control).
ignore = [
    # bincode 1.x: unmaintained. Transitive via iai-callgrind (dev-only benchmarks).
    # No alternative available — bincode is embedded in the benchmark runner.
    { id = "RUSTSEC-2025-0141", reason = "dev-only transitive via iai-callgrind benchmarks" },

    # rsa 0.9: Marvin Attack timing side-channel. Transitive via sqlx-mysql.
    # We don't use MySQL TLS with RSA keys in production; PostgreSQL is primary.
    { id = "RUSTSEC-2023-0071", reason = "transitive via sqlx-mysql, not used in production" },

    # instant: unmaintained, replaced by web-time. Transitive via notify → varpulis-cli.
    # No safe upgrade: notify-types 1.0 still depends on instant.
    { id = "RUSTSEC-2024-0384", reason = "transitive via notify-types, no upstream fix" },

    # number_prefix: unmaintained. Transitive via indicatif → varpulis-cli.
    # No safe upgrade available.
    { id = "RUSTSEC-2025-0119", reason = "transitive via indicatif, no upstream fix" },

    # lru 0.16: `LruCache::pop()` is not panic-safe if a *key's* `Drop` panics.
    # Transitive via aws-sdk-s3 1.128 (S3 Express identity cache). Its keys carry
    # no custom `Drop`, so the precondition cannot occur. The patched lru
    # (>=0.18.2) is only pulled by aws-sdk-s3 >=1.144, whose rust-version is
    # 1.94.1 — above the workspace MSRV (1.93). Revisit when the MSRV moves.
    { id = "RUSTSEC-2026-0253", reason = "transitive via aws-sdk-s3 1.128; keys have no custom Drop; fix needs MSRV >= 1.94" },

    # crypto-bigint 0.4 and 0.5: timing variability in operations meant to be
    # constant-time. Fixed only in >=0.7.6, with no backport. Transitive via
    # aws-sigv4 1.4 (`sigv4a` feature); aws-sigv4 moves to 0.7 in 1.6.4, whose
    # rust-version is 1.94.1, above the workspace MSRV (1.93). It comes only with
    # the optional `s3-state` feature, which no shipped build enables, and only
    # sign/v4a.rs runs it: the SDK signs with SigV4A for Multi-Region Access Point
    # and Outposts ARNs, or if AWS_AUTH_SCHEME_PREFERENCE asks for it, not for a
    # plain bucket name. Nothing in the workspace constructs S3StateStore.
    # Revisit when the MSRV moves.
    { id = "RUSTSEC-2026-0387", reason = "via aws-sigv4 sigv4a behind optional s3-state, SigV4A only; fix needs MSRV >= 1.94" },

    # pin-utils: unmaintained (repository archived 2026-10-01), no patched
    # release exists. Transitive via aws-smithy-types, -runtime and -http, which
    # use only its `pin_mut!` macro, behind the optional `s3-state` feature. They
    # drop it in 1.9, 1.16.1 and 0.64.2, whose rust-version is 1.94.1, above the
    # workspace MSRV (1.93). Revisit when the MSRV moves.
    { id = "RUSTSEC-2026-0441", reason = "pin_mut! macro only, behind optional s3-state; removal needs MSRV >= 1.94" },

    # rand: unsound with custom logger calling rand::rng() during reseed.
    # Requires ALL of: `log` + `thread_rng` features, custom logger,
    # that logger calling rand::rng() with trace/warn logging. We don't
    # define a custom logger that uses rand, so the preconditions don't hold.
    { id = "RUSTSEC-2026-0097", reason = "preconditions not applicable — no custom logger using rand::rng()" },

    # proc-macro-error2: unmaintained. Transitive via iai-callgrind-macros
    # (dev-only benchmarks, same tree as the bincode ignore above).
    { id = "RUSTSEC-2026-0173", reason = "dev-only transitive via iai-callgrind benchmarks" },

    # quick-xml 0.26: attribute-parsing DoS advisories. Transitive via
    # inferno → pprof (dev-only profiling); inferno pins quick-xml 0.26,
    # fix requires >=0.41. Never parses attacker-controlled XML here.
    { id = "RUSTSEC-2026-0194", reason = "dev-only transitive via pprof/inferno flamegraphs" },
    { id = "RUSTSEC-2026-0195", reason = "dev-only transitive via pprof/inferno flamegraphs" },

    # unsafe-libyaml: unmaintained (repository archived 2024-03), no safe
    # upgrade. Transitive via serde_yaml 0.9, which varpulis-connectors uses
    # only to parse a credentials file (CredentialsStore::from_yaml, 0600
    # checked); nothing in the workspace loads one since ADR-008. Leaves with
    # varpulis-connectors when `async-runtime` is removed (ADR-008's next change).
    { id = "RUSTSEC-2024-0449", reason = "via serde_yaml, credentials file only; leaves with async-runtime (ADR-008)" },
]

# ---------------------------------------------------------------------------
# Licenses — only allow permissive licenses
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ---------------------------------------------------------------------------
# Bans — disallow specific crates or features
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"

# ---------------------------------------------------------------------------
# Sources — only allow crates from crates.io
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
