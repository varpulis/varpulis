# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# ---------------------------------------------------------------------------
# Advisories — check for known vulnerabilities and unmaintained crates
# ---------------------------------------------------------------------------
[advisories]
# Fail on any vulnerability, but allow specific unmaintained crates that we've
# evaluated and accepted the risk for (transitive dependencies we can't control).
ignore = [
    # bincode 1.x: unmaintained. Transitive via iai-callgrind (dev-only benchmarks).
    # No alternative available — bincode is embedded in the benchmark runner.
    { id = "RUSTSEC-2025-0141", reason = "dev-only transitive via iai-callgrind benchmarks" },

    # rustls-pemfile 2.x: unmaintained. Still pulled by rumqttc 0.25 and async-nats 0.38.
    # Cert parsing only, low attack surface. No upstream fix available yet.
    { id = "RUSTSEC-2025-0134", reason = "cert parsing only, no upstream fix for rumqttc/async-nats" },

    # async-std 1.x: unmaintained. Transitive via pulsar crate (pulsar feature only).
    # No upstream fix: pulsar-rs has not released a version without async-std.
    { id = "RUSTSEC-2025-0052", reason = "transitive via pulsar crate, pulsar feature only" },

    # rsa 0.9: Marvin Attack timing side-channel. Transitive via sqlx-mysql.
    # We don't use MySQL TLS with RSA keys in production; PostgreSQL is primary.
    { id = "RUSTSEC-2023-0071", reason = "transitive via sqlx-mysql, not used in production" },

    # rustls-webpki 0.102.x: CRL distributionPoint bypass. Transitive via async-nats 0.46.
    # async-nats pins rustls-webpki 0.102; fix requires >=0.103.10. No upstream fix yet.
    { id = "RUSTSEC-2026-0049", reason = "transitive via async-nats 0.46, no upstream fix yet" },
]

# ---------------------------------------------------------------------------
# Licenses — only allow permissive licenses
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ---------------------------------------------------------------------------
# Bans — disallow specific crates or features
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"

# ---------------------------------------------------------------------------
# Sources — only allow crates from crates.io
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
