name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  build:
    name: Build ${{ matrix.target }}
    needs: audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: varpulis
            asset_name: varpulis-linux-x86_64

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: varpulis
            asset_name: varpulis-linux-aarch64
            use_cross: true

          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: varpulis
            asset_name: varpulis-macos-x86_64

          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: varpulis
            asset_name: varpulis-macos-aarch64

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: varpulis.exe
            asset_name: varpulis-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install connector system dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev protobuf-compiler zlib1g-dev

      - name: Install LLVM tools for PGO+BOLT (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          rustup component add llvm-tools
          sudo apt-get install -y bolt-19 libbolt-19-dev

      - name: Build with PGO+BOLT (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          # PGO-optimized CLI binary (builds to target/release/)
          ./scripts/pgo-build.sh
          # Use BOLT binary if available, otherwise PGO-only
          if [ -f target/release/varpulis-pgo-bolt ]; then
            cp target/release/varpulis-pgo-bolt target/release/varpulis
          fi
          # Copy to target triple path expected by artifact step
          mkdir -p target/${{ matrix.target }}/release
          cp target/release/varpulis target/${{ matrix.target }}/release/varpulis
          # LSP built with same PGO profile (benefits from shared runtime code)
          RUSTFLAGS="-Cprofile-use=$(pwd)/target/pgo-merged.profdata" \
            cargo build --release --target ${{ matrix.target }} -p varpulis-lsp

      - name: Build (cross)
        if: matrix.use_cross
        run: |
          cross build --release --target ${{ matrix.target }} -p varpulis-cli
          cross build --release --target ${{ matrix.target }} -p varpulis-lsp

      - name: Build (native, non-PGO)
        if: ${{ !matrix.use_cross && matrix.target != 'x86_64-unknown-linux-gnu' }}
        run: |
          # rust-toolchain.toml pins the toolchain cargo actually uses (1.95.0),
          # and dtolnay/rust-toolchain@stable only adds the matrix target to
          # `stable`. For a cross target that isn't the runner's host (e.g.
          # x86_64-apple-darwin on the ARM macos-latest runner), the pinned
          # toolchain is missing it → E0463 "can't find crate for `core`".
          # Add it to the toolchain resolved by rust-toolchain.toml in this dir.
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} -p varpulis-cli
          cargo build --release --target ${{ matrix.target }} -p varpulis-lsp

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/varpulis-lsp artifacts/varpulis-lsp-${{ matrix.target }}
          chmod +x artifacts/${{ matrix.asset_name }}
          chmod +x artifacts/varpulis-lsp-${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/varpulis-lsp.exe artifacts/varpulis-lsp-${{ matrix.target }}.exe

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/${{ matrix.asset_name }}

      - name: Upload LSP artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: varpulis-lsp-${{ matrix.target }}
          path: artifacts/varpulis-lsp-${{ matrix.target }}

      - name: Upload LSP artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: varpulis-lsp-${{ matrix.target }}.exe
          path: artifacts/varpulis-lsp-${{ matrix.target }}.exe

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: varpulis-linux-x86_64
          path: docker-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

  release:
    name: Create Release
    needs: [build, docker]
    # Publish whatever built. A single failed target (or the docker job) must not
    # skip the release entirely — otherwise a missing binary silently blocks the
    # whole release, which is how v0.11.0 initially failed to publish.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | xargs ls -la

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            for file in "$dir"*; do
              if [ -f "$file" ]; then
                sha256sum "$file" >> checksums.txt
              fi
            done
          done
          cat checksums.txt

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Extract notes from CHANGELOG if exists, otherwise use default
          if [ -f CHANGELOG.md ]; then
            # Extract section for this version
            sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | head -n -1 > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "Release $VERSION" > notes.md
            echo "" >> notes.md
            echo "See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." >> notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Varpulis v${{ steps.release_notes.outputs.version }}
          body_path: notes.md
          draft: false
          # Don't fail the release if a target's binary is missing (e.g. one
          # build target failed) — publish the assets that are present.
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          files: |
            artifacts/varpulis-linux-x86_64/varpulis-linux-x86_64
            artifacts/varpulis-linux-aarch64/varpulis-linux-aarch64
            artifacts/varpulis-macos-x86_64/varpulis-macos-x86_64
            artifacts/varpulis-macos-aarch64/varpulis-macos-aarch64
            artifacts/varpulis-windows-x86_64.exe/varpulis-windows-x86_64.exe
            artifacts/varpulis-lsp-x86_64-unknown-linux-gnu/varpulis-lsp-x86_64-unknown-linux-gnu
            artifacts/varpulis-lsp-aarch64-unknown-linux-gnu/varpulis-lsp-aarch64-unknown-linux-gnu
            artifacts/varpulis-lsp-x86_64-apple-darwin/varpulis-lsp-x86_64-apple-darwin
            artifacts/varpulis-lsp-aarch64-apple-darwin/varpulis-lsp-aarch64-apple-darwin
            artifacts/varpulis-lsp-x86_64-pc-windows-msvc.exe/varpulis-lsp-x86_64-pc-windows-msvc.exe
            artifacts/checksums.txt

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download release binaries and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/varpulis/varpulis/releases/download/v${VERSION}"

          for asset in varpulis-macos-x86_64 varpulis-macos-aarch64 varpulis-linux-x86_64 varpulis-linux-aarch64; do
            curl -fsSL -o "$asset" "${BASE}/${asset}"
            HASH=$(sha256sum "$asset" | cut -d' ' -f1)
            KEY=$(echo "$asset" | tr '-' '_')
            echo "${KEY}=${HASH}" >> "$GITHUB_OUTPUT"
            echo "$asset: $HASH"
          done

      - name: Checkout homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: varpulis/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > homebrew-tap/Formula/varpulis.rb << 'FORMULA'
          class Varpulis < Formula
            desc "Modern streaming analytics engine with advanced pattern detection"
            homepage "https://github.com/varpulis/varpulis"
            version "VERSION_PLACEHOLDER"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_intel do
                url "https://github.com/varpulis/varpulis/releases/download/v#{version}/varpulis-macos-x86_64"
                sha256 "SHA_MACOS_X86_64"
              end

              on_arm do
                url "https://github.com/varpulis/varpulis/releases/download/v#{version}/varpulis-macos-aarch64"
                sha256 "SHA_MACOS_AARCH64"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/varpulis/varpulis/releases/download/v#{version}/varpulis-linux-x86_64"
                sha256 "SHA_LINUX_X86_64"
              end

              on_arm do
                url "https://github.com/varpulis/varpulis/releases/download/v#{version}/varpulis-linux-aarch64"
                sha256 "SHA_LINUX_AARCH64"
              end
            end

            def install
              if OS.mac? && Hardware::CPU.intel?
                bin.install "varpulis-macos-x86_64" => "varpulis"
              elsif OS.mac? && Hardware::CPU.arm?
                bin.install "varpulis-macos-aarch64" => "varpulis"
              elsif OS.linux? && Hardware::CPU.intel?
                bin.install "varpulis-linux-x86_64" => "varpulis"
              elsif OS.linux? && Hardware::CPU.arm?
                bin.install "varpulis-linux-aarch64" => "varpulis"
              end
            end

            test do
              assert_match "varpulis #{version}", shell_output("#{bin}/varpulis --version")
            end
          end
          FORMULA

          # Strip leading whitespace from heredoc
          sed -i 's/^          //' homebrew-tap/Formula/varpulis.rb

          # Substitute placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" homebrew-tap/Formula/varpulis.rb
          sed -i "s/SHA_MACOS_X86_64/${{ steps.sha.outputs.varpulis_macos_x86_64 }}/" homebrew-tap/Formula/varpulis.rb
          sed -i "s/SHA_MACOS_AARCH64/${{ steps.sha.outputs.varpulis_macos_aarch64 }}/" homebrew-tap/Formula/varpulis.rb
          sed -i "s/SHA_LINUX_X86_64/${{ steps.sha.outputs.varpulis_linux_x86_64 }}/" homebrew-tap/Formula/varpulis.rb
          sed -i "s/SHA_LINUX_AARCH64/${{ steps.sha.outputs.varpulis_linux_aarch64 }}/" homebrew-tap/Formula/varpulis.rb

          echo "Generated formula:"
          cat homebrew-tap/Formula/varpulis.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/varpulis.rb
          git diff --cached --quiet && echo "No changes to formula" || {
            git commit -m "Update varpulis to ${{ steps.version.outputs.version }}"
            git push
          }
