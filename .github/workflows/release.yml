name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  # The release chain used to run audit -> build -> docker -> release with
  # nothing waiting on a test run: a tag could ship binaries from a commit
  # whose tests had never passed. CI does run on tags, but as a SEPARATE
  # workflow that this one neither waits for nor observes — so the gate has to
  # live here. Same suite as the CI `Test` job.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-test
      - uses: taiki-e/install-action@nextest
      - name: Install connector system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev protobuf-compiler zlib1g-dev
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc

  build:
    name: Build ${{ matrix.target }}
    needs: [audit, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: varpulis
            asset_name: varpulis-linux-x86_64

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: varpulis
            asset_name: varpulis-linux-aarch64
            use_cross: true

          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: varpulis
            asset_name: varpulis-macos-x86_64

          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: varpulis
            asset_name: varpulis-macos-aarch64

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: varpulis.exe
            asset_name: varpulis-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: |
          cross build --release --target ${{ matrix.target }} -p varpulis-cli
          cross build --release --target ${{ matrix.target }} -p varpulis-lsp

      - name: Build (native, non-PGO)
        if: ${{ !matrix.use_cross }}
        run: |
          # rust-toolchain.toml pins the toolchain cargo actually uses (1.95.0),
          # and dtolnay/rust-toolchain@stable only adds the matrix target to
          # `stable`. For a cross target that isn't the runner's host (e.g.
          # x86_64-apple-darwin on the ARM macos-latest runner), the pinned
          # toolchain is missing it → E0463 "can't find crate for `core`".
          # Add it to the toolchain resolved by rust-toolchain.toml in this dir.
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} -p varpulis-cli
          cargo build --release --target ${{ matrix.target }} -p varpulis-lsp

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/varpulis-lsp artifacts/varpulis-lsp-${{ matrix.target }}
          chmod +x artifacts/${{ matrix.asset_name }}
          chmod +x artifacts/varpulis-lsp-${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/varpulis-lsp.exe artifacts/varpulis-lsp-${{ matrix.target }}.exe

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/${{ matrix.asset_name }}

      - name: Upload LSP artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: varpulis-lsp-${{ matrix.target }}
          path: artifacts/varpulis-lsp-${{ matrix.target }}

      - name: Upload LSP artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: varpulis-lsp-${{ matrix.target }}.exe
          path: artifacts/varpulis-lsp-${{ matrix.target }}.exe

  release:
    name: Create Release
    needs: [audit, test, build]
    # Publish whatever built. A single failed target (or the docker job) must not
    # skip the release entirely — otherwise a missing binary silently blocks the
    # whole release, which is how v0.11.0 initially failed to publish.
    #
    # BUT `!cancelled()` on its own also runs this job when `audit` or `test`
    # FAILED (and `build` was therefore skipped), which would publish a release
    # off a red commit — the exact hole this workflow is being fixed for. The
    # gates are named explicitly so tolerance stays scoped to the build matrix.
    if: ${{ !cancelled() && needs.audit.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | xargs ls -la

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            for file in "$dir"*; do
              if [ -f "$file" ]; then
                sha256sum "$file" >> checksums.txt
              fi
            done
          done
          cat checksums.txt

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Extract notes from CHANGELOG if exists, otherwise use default
          if [ -f CHANGELOG.md ]; then
            # Extract section for this version
            sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | head -n -1 > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "Release $VERSION" > notes.md
            echo "" >> notes.md
            echo "See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." >> notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Varpulis v${{ steps.release_notes.outputs.version }}
          body_path: notes.md
          draft: false
          # Don't fail the release if a target's binary is missing (e.g. one
          # build target failed) — publish the assets that are present.
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          files: |
            artifacts/varpulis-linux-x86_64/varpulis-linux-x86_64
            artifacts/varpulis-linux-aarch64/varpulis-linux-aarch64
            artifacts/varpulis-macos-x86_64/varpulis-macos-x86_64
            artifacts/varpulis-macos-aarch64/varpulis-macos-aarch64
            artifacts/varpulis-windows-x86_64.exe/varpulis-windows-x86_64.exe
            artifacts/varpulis-lsp-x86_64-unknown-linux-gnu/varpulis-lsp-x86_64-unknown-linux-gnu
            artifacts/varpulis-lsp-aarch64-unknown-linux-gnu/varpulis-lsp-aarch64-unknown-linux-gnu
            artifacts/varpulis-lsp-x86_64-apple-darwin/varpulis-lsp-x86_64-apple-darwin
            artifacts/varpulis-lsp-aarch64-apple-darwin/varpulis-lsp-aarch64-apple-darwin
            artifacts/varpulis-lsp-x86_64-pc-windows-msvc.exe/varpulis-lsp-x86_64-pc-windows-msvc.exe
            artifacts/checksums.txt

