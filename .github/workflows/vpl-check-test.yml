name: VPL Check (Self-Test)

# Runs on every push/PR, unfiltered on purpose.
#
# This workflow used to be path-filtered to `examples/**` and `demos/**`, so an
# engine change could break every shipped example without ever triggering it.
# It also pinned CLI v0.4.0 (Feb 2026) and invoked `varpulis check -f <file>`,
# a flag that no longer exists — and passed `path: examples/`, which the
# action's `find -path` matched against zero files. It therefore validated
# nothing, with a stale binary, on the wrong trigger.
#
# Now: build the CLI from THIS commit, parse-check every shipped .vpl with it,
# and then actually EXECUTE the examples and assert on their output.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vpl-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-cli:
    name: Build CLI from source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: vpl-check-cli
      # `repl` because the documentation uses `varpulis repl`, and a binary
      # without it reports that subcommand as missing. Any other feature-gated
      # subcommand the docs pick up needs adding here too — the alternative is
      # an exemption list in the checker, which would also excuse a subcommand
      # that was genuinely removed.
      - name: Build varpulis
        run: cargo build --release -p varpulis-cli --features repl
      - uses: actions/upload-artifact@v7
        with:
          name: varpulis-cli-vpl-check
          path: target/release/varpulis
          retention-days: 1

  check-examples:
    name: Parse-check example VPL files
    needs: [build-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: varpulis-cli-vpl-check
          path: cli
      - run: chmod +x cli/varpulis
      - name: Check examples
        uses: ./.github/actions/varpulis-check
        with:
          path: 'examples/'
          binary: ${{ github.workspace }}/cli/varpulis

  check-demos:
    name: Parse-check demo VPL files
    needs: [build-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: varpulis-cli-vpl-check
          path: cli
      - run: chmod +x cli/varpulis
      - name: Check demos
        uses: ./.github/actions/varpulis-check
        with:
          path: 'demos/'
          binary: ${{ github.workspace }}/cli/varpulis

  check-docs:
    name: Check VPL in the documentation
    needs: [build-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: varpulis-cli-vpl-check
          path: cli
      - run: chmod +x cli/varpulis
      # The shipped `.vpl` files were already checked; the documentation's
      # fenced blocks were not, and they are what a reader copies. 82 of them
      # opened with a `//` comment, which VPL does not have, so the first line
      # a new user pasted did not parse.
      - name: Check documented VPL
        run: python3 scripts/check-doc-vpl.py "$GITHUB_WORKSPACE/cli/varpulis"

  check-cli-docs:
    name: Documented Commands Parse
    needs: [build-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: varpulis-cli-vpl-check
          path: cli
      - run: chmod +x cli/varpulis
      # `docs/examples/hvac-building.md` documented
      # `varpulis run <file> --source ... --output ...`; `run` takes
      # `-f/--file` and neither of those flags exists. Other pages used the
      # correct form, so a reader could pick either and only one worked.
      #
      # The binary this checks is built from the current commit by `build-cli`,
      # so a flag renamed in the code reddens the documentation that still
      # names the old one.
      - name: Check documented command lines
        run: python3 scripts/check-documented-cli.py "$GITHUB_WORKSPACE/cli/varpulis"

  run-examples:
    name: Execute examples and assert output
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: vpl-run-examples
      # `varpulis check` only parses. These tests load the shipped VPL, feed it
      # the shipped .evt, and assert the exact output — the only thing that can
      # tell a working example from one that silently emits nothing.
      - name: Examples E2E
        run: cargo test -p varpulis-runtime --test examples_e2e -- --nocapture
      # The equivalent gate for the security demo, kept on the same trigger so
      # both sets of shipped artifacts move together.
      - name: Security demo E2E
        run: cargo test -p varpulis-runtime --test security_demo_e2e -- --nocapture
