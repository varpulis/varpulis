name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not actually publish)'
        type: boolean
        default: true
      crate:
        description: 'Publish a single crate (leave empty for all)'
        type: choice
        options:
          - all
          - varpulis-core
          - varpulis-actors
          - varpulis-zdd
          - varpulis-pst
          - varpulis-datagen
          - varpulis-db
          - varpulis-parser
          - varpulis-simd
          - varpulis-hamlet
          - varpulis-dead-letter
          - varpulis-connectors
          - varpulis-sase
          - varpulis-enrichment
          - varpulis-lsp
          - varpulis-mcp
          - varpulis-wasm
          - varpulis-runtime
          - varpulis-cluster
          - varpulis-cli
        default: 'all'
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  # Wait for crates.io index to update between publishes
  PUBLISH_DELAY: 30

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify workspace builds
        run: cargo check --workspace

      - name: Determine dry-run flag
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=--dry-run" >> "$GITHUB_OUTPUT"
            echo "Running in DRY RUN mode"
          else
            echo "dry_run=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine crate filter
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.crate }}" != "all" ]; then
            echo "single=${{ inputs.crate }}" >> "$GITHUB_OUTPUT"
          else
            echo "single=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish crates
        run: |
          DRY_RUN="${{ steps.flags.outputs.dry_run }}"
          SINGLE="${{ steps.filter.outputs.single }}"

          # Dependency-ordered list of all publishable crates
          # Level 0: no internal deps
          # Level 1: depends on level 0 only
          # Level 2+: depends on lower levels
          # Note: varpulis-core has a dev-dep on varpulis-parser (cycle),
          # so we use --no-verify and rely on the workspace check above.
          CRATES=(
            "varpulis-core"
            "varpulis-actors"
            "varpulis-zdd"
            "varpulis-pst"
            "varpulis-datagen"
            "varpulis-db"
            "varpulis-parser"
            "varpulis-simd"
            "varpulis-hamlet"
            "varpulis-dead-letter"
            "varpulis-connectors"
            "varpulis-sase"
            "varpulis-enrichment"
            "varpulis-lsp"
            "varpulis-mcp"
            "varpulis-wasm"
            "varpulis-runtime"
            "varpulis-cluster"
            "varpulis-cli"
          )

          publish_crate() {
            local crate="$1"
            echo "========================================"
            echo "Publishing $crate..."
            echo "========================================"

            # Check if this version is already published
            CURRENT_VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name == \"$crate\") | .version")

            if [ -z "$DRY_RUN" ]; then
              # Check all published versions, not just the latest
              PUBLISHED_VERSIONS=$(curl -sSL "https://crates.io/api/v1/crates/$crate" 2>/dev/null \
                | jq -r '.versions[].num // empty' 2>/dev/null || echo "")
              if echo "$PUBLISHED_VERSIONS" | grep -qx "$CURRENT_VERSION"; then
                echo "  $crate v$CURRENT_VERSION is already published, skipping"
                return 0
              fi
            fi

            local retries=0
            local max_retries=3
            while [ $retries -le $max_retries ]; do
              local output
              output=$(cargo publish -p "$crate" --no-verify $DRY_RUN 2>&1) && {
                echo "$output"
                break
              }
              echo "$output"

              # "already exists" is not a retriable error — treat as success
              if echo "$output" | grep -q "already exists"; then
                echo "  $crate v$CURRENT_VERSION already on registry, skipping"
                return 0
              fi

              retries=$((retries + 1))
              if [ $retries -gt $max_retries ]; then
                echo "  FAILED after $max_retries retries"
                return 1
              fi
              echo "  Publish failed (attempt $retries/$max_retries), waiting 90s before retry..."
              sleep 90
            done

            if [ -z "$DRY_RUN" ]; then
              echo "  Waiting ${PUBLISH_DELAY}s for crates.io index update..."
              sleep "$PUBLISH_DELAY"
            fi

            echo "  Done: $crate v$CURRENT_VERSION"
            echo ""
          }

          if [ -n "$SINGLE" ]; then
            publish_crate "$SINGLE"
          else
            for crate in "${CRATES[@]}"; do
              publish_crate "$crate"
            done
          fi

          echo "========================================"
          echo "All crates published successfully!"
          echo "========================================"
