name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not actually publish)'
        type: boolean
        default: true
      crate:
        description: 'Publish a single crate (leave empty for all)'
        type: choice
        options:
          - all
          - varpulis-core
          - varpulis-zdd
          - varpulis-parser
          - varpulis-datagen
          - varpulis-db
          - varpulis-runtime
          - varpulis-lsp
          - varpulis-wasm
          - varpulis-mcp
          - varpulis-cluster
          - varpulis-cli
        default: 'all'
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  # Wait for crates.io index to update between publishes
  PUBLISH_DELAY: 30

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify workspace builds
        run: cargo check --workspace

      - name: Determine dry-run flag
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=--dry-run" >> "$GITHUB_OUTPUT"
            echo "Running in DRY RUN mode"
          else
            echo "dry_run=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine crate filter
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.crate }}" != "all" ]; then
            echo "single=${{ inputs.crate }}" >> "$GITHUB_OUTPUT"
          else
            echo "single=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish crates
        run: |
          DRY_RUN="${{ steps.flags.outputs.dry_run }}"
          SINGLE="${{ steps.filter.outputs.single }}"

          # Dependency-ordered list of all publishable crates
          CRATES=(
            "varpulis-core"
            "varpulis-zdd"
            "varpulis-parser"
            "varpulis-datagen"
            "varpulis-db"
            "varpulis-runtime"
            "varpulis-lsp"
            "varpulis-wasm"
            "varpulis-mcp"
            "varpulis-cluster"
            "varpulis-cli"
          )

          publish_crate() {
            local crate="$1"
            echo "========================================"
            echo "Publishing $crate..."
            echo "========================================"

            # Check if this version is already published
            CURRENT_VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name == \"$crate\") | .version")

            if [ -z "$DRY_RUN" ]; then
              PUBLISHED=$(curl -fsSL "https://crates.io/api/v1/crates/$crate" 2>/dev/null \
                | jq -r ".versions[0].num // empty" 2>/dev/null || echo "")
              if [ "$PUBLISHED" = "$CURRENT_VERSION" ]; then
                echo "  $crate v$CURRENT_VERSION is already published, skipping"
                return 0
              fi
            fi

            cargo publish -p "$crate" $DRY_RUN

            if [ -z "$DRY_RUN" ]; then
              echo "  Waiting ${PUBLISH_DELAY}s for crates.io index update..."
              sleep "$PUBLISH_DELAY"
            fi

            echo "  Done: $crate v$CURRENT_VERSION"
            echo ""
          }

          if [ -n "$SINGLE" ]; then
            publish_crate "$SINGLE"
          else
            for crate in "${CRATES[@]}"; do
              publish_crate "$crate"
            done
          fi

          echo "========================================"
          echo "All crates published successfully!"
          echo "========================================"
