name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Nightly full run + manual "run now" button. The heavy suite (matrix,
  # cross-platform, E2E, chaos, coverage) is gated to these events + release
  # tags via each job's `if:` below, so ordinary PRs only pay the fast gate.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# A push to a PR branch supersedes the in-flight run — cancel it instead of
# finishing the matrix for a commit nobody will merge. Runs on main
# are never cancelled so every merged commit keeps a complete CI record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Tiered CI:
#   * Fast gate (fmt, clippy, check, test, deny, audit, machete,
#     feature-matrix-check, +semver on PRs) runs on every push/PR — this is
#     what you watch before merging.
#   * Heavy suite (msrv, cross-platform, feature-flags matrix, wasm, coverage,
#     doc, chaos, CDC/NATS E2E) is gated by `HEAVY` below to: the nightly
#     schedule, manual `workflow_dispatch`, and release tags (`refs/tags/*`).
#     It does NOT run per-PR, so PR feedback is ~5 min instead of ~15.
# Anchor for the heavy-job gate (kept as a comment so it stays in one place):
#   github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
#     || startsWith(github.ref, 'refs/tags/')

jobs:
  # Gate job: skip entire CI for Dependabot PRs to conserve Actions minutes.
  # Dependabot PRs are validated on merge to main instead.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.actor != 'dependabot[bot]'
    steps:
      - run: echo "CI gate passed"

  msrv:
    name: MSRV (1.93)
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Install connector system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev protobuf-compiler zlib1g-dev
      - run: cargo test --workspace

  check:
    name: Check
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install connector system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev protobuf-compiler zlib1g-dev
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Install connector system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev protobuf-compiler zlib1g-dev
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc

  cross-platform:
    name: ${{ matrix.os }}
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Check and test (exclude connectors needing system libs)
        run: |
          cargo check --workspace --exclude varpulis-connector-kafka --exclude varpulis-connector-pulsar --exclude varpulis-connector-elasticsearch
          cargo test --workspace --exclude varpulis-connector-kafka --exclude varpulis-connector-pulsar --exclude varpulis-connector-elasticsearch

  # fmt / clippy / audit / deny are thin CI wrappers around scripts/verify.sh:
  # the script is the single source of truth for what these gates run, so a
  # green local `./scripts/verify.sh` should keep CI green. CI-specific bits
  # (toolchain install, cache, cargo-audit/deny install) stay inline.
  fmt:
    name: Format
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Run verify.sh (fmt only)
        run: bash scripts/verify.sh
        env:
          SKIP_CLIPPY: "1"
          SKIP_AUDIT: "1"
          SKIP_DENY: "1"

  clippy:
    name: Clippy
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install connector system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev protobuf-compiler zlib1g-dev
      - name: Run verify.sh (clippy only)
        run: bash scripts/verify.sh
        env:
          SKIP_FMT: "1"
          SKIP_AUDIT: "1"
          SKIP_DENY: "1"

  deny:
    name: Deny (licenses & advisories)
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.6
      - name: Run verify.sh (deny only)
        run: bash scripts/verify.sh
        env:
          SKIP_FMT: "1"
          SKIP_CLIPPY: "1"
          SKIP_AUDIT: "1"

  audit:
    name: Audit
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run verify.sh (audit only)
        run: bash scripts/verify.sh
        env:
          SKIP_FMT: "1"
          SKIP_CLIPPY: "1"
          SKIP_DENY: "1"

  machete:
    name: Unused Dependencies
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - run: cargo machete

  feature-matrix-check:
    name: Feature Matrix Is Honest
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On the fast path on purpose. The generator refuses to run when its SKIP
    # table names a feature no crate declares, or excuses one as default-on
    # that is not actually in any default set. Both are ways coverage silently
    # shrinks, and both are worth catching on the PR rather than at 03:00.
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/feature-matrix.py > /dev/null

  semver:
    name: Semver Checks
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # PR-only: needs the PR base commit as its semver baseline. Stays on the
    # fast path because it is the cheapest place to catch an accidental public
    # API break, and it is scoped to the four externally-consumed crates.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: semver
      # semver-checks rustdoc-builds crates with --all-features, which
      # reaches rdkafka-sys (needs curl/zlib headers) and pulsar (needs
      # protoc). Without these the job dies on build errors before ever
      # evaluating an API — which is how it silently rotted: it only
      # triggers on non-dependabot PRs, and those were rare.
      - name: Install connector system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev protobuf-compiler zlib1g-dev
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      # Scoped to the crates external consumers depend on: the engine
      # surface (core/runtime/parser) and the connector SDK. A full
      # --workspace pass rustdoc-builds all ~35 crates twice and blew
      # through 90 minutes on a hosted runner; the internal crates it
      # would add are not a public contract.
      - name: Check semver compliance
        run: >-
          cargo semver-checks
          --package varpulis-core
          --package varpulis-runtime
          --package varpulis-parser
          --package varpulis-connector-api
          --baseline-rev ${{ github.event.pull_request.base.sha }}

  feature-matrix:
    name: Feature Matrix
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      features: ${{ steps.generate.outputs.features }}
    steps:
      - uses: actions/checkout@v6
      # The list below used to be hand-written in this file, and it drifted:
      # `saas` was never added, so varpulis-cli's test targets stopped
      # compiling under it and no job noticed. Deriving the matrix from the
      # manifests makes that drift impossible — a new feature is covered on
      # the next run, and leaving one out costs a justified entry in the
      # script's SKIP table.
      # Deliberately not `echo "features=$(...)"`: a command substitution
      # inside an argument swallows the generator's exit status, so a broken
      # script would emit an empty matrix and the whole feature suite would
      # vanish without a red job. That is the failure mode this file is being
      # changed to remove, so the generator's status is checked directly.
      - id: generate
        run: |
          python3 scripts/feature-matrix.py > matrix.json
          test -s matrix.json
          echo "features=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "$(python3 -c 'import json;print(len(json.load(open("matrix.json"))))') features will be verified" >> "$GITHUB_STEP_SUMMARY"

  feature-flags:
    name: Feature Flags (${{ matrix.name }})
    needs: [feature-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.feature-matrix.outputs.features) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.feature }}
      - name: Install connector system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev protobuf-compiler zlib1g-dev
      # Workspace-wide, because enabling a feature changes feature unification
      # for every crate that shares a dependency with the ones declaring it.
      - run: cargo check --workspace --features ${{ matrix.feature }}
      # Scoped to the declaring crates, because this is the expensive half and
      # `--all-targets` is the half that matters: it compiles tests, benches
      # and examples, which is exactly what had rotted under `saas`.
      - run: cargo clippy ${{ matrix.packages }} --all-targets --features ${{ matrix.feature }} -- -D warnings

  wasm:
    name: WASM Build
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Check WASM build
        run: cargo check -p varpulis-wasm --target wasm32-unknown-unknown

  chaos-tests:
    name: Chaos Tests
    needs: [check, test]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # NATS unlocks the coordinator-failover and network-partition chaos tests
    # (tier 2 in scripts/run-chaos-tests.sh). Without it they abstain, and the
    # runner refuses to count an abstention as a pass.
    services:
      nats:
        image: nats:latest
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: chaos
      # `raft` and `nats-transport` are what the coordinator/worker processes
      # spawned by the chaos harness need in order to elect a leader and to
      # register over NATS. Without them tier 2 cannot run at all.
      - name: Build release binary (raft + NATS transport)
        run: cargo build --release -p varpulis-cli --features raft,nats-transport
      - name: Run chaos tests with retry
        run: ./scripts/run-chaos-tests.sh 2
        env:
          VARPULIS_BIN: ${{ github.workspace }}/target/release/varpulis
          # Compile every chaos module, including the ones gated behind
          # `distributed-checkpoint` / `raft` — otherwise they are #[cfg]'d out
          # of the test binary and silently never run.
          CHAOS_FEATURES: distributed-checkpoint,raft
          CHAOS_NATS: "1"
          # CHAOS_DC stays off: the blocker is that varpulis-cli exposes no
          # `distributed-checkpoint` feature, so the spawned worker has no
          # barrier handler compiled in. Adding a Kafka container would not
          # change that. See the tier-3 comment in the runner.
          NO_COLOR: "1"

  # Web UI moved to https://github.com/varpulis/varpulis-web-ui

  coverage:
    name: Coverage
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install connector system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev protobuf-compiler zlib1g-dev
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  doc:
    name: Documentation
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
      - name: Install connector system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev protobuf-compiler zlib1g-dev
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  cdc-e2e:
    name: CDC E2E
    needs: [check]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: varpulis
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: cdc_test
        options: >-
          --health-cmd "pg_isready -U varpulis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cdc-e2e
      - name: Configure PostgreSQL for logical replication
        run: |
          docker exec ${{ job.services.postgres.id }} sh -c "
            echo 'wal_level = logical' >> /var/lib/postgresql/data/postgresql.conf
            echo 'max_replication_slots = 4' >> /var/lib/postgresql/data/postgresql.conf
            echo 'max_wal_senders = 4' >> /var/lib/postgresql/data/postgresql.conf
          "
          docker restart ${{ job.services.postgres.id }}
          sleep 5
          # Wait for PostgreSQL to be ready after restart
          for i in $(seq 1 30); do
            pg_isready -h localhost -U varpulis -d cdc_test && break
            sleep 2
          done
      - name: Create test tables and publication
        run: |
          PGPASSWORD=testpass psql -h localhost -U varpulis -d cdc_test -c "
            CREATE TABLE IF NOT EXISTS orders (
              id SERIAL PRIMARY KEY,
              customer TEXT NOT NULL,
              amount DOUBLE PRECISION NOT NULL,
              status TEXT DEFAULT 'pending'
            );
            CREATE TABLE IF NOT EXISTS products (
              id SERIAL PRIMARY KEY,
              name TEXT NOT NULL,
              price DOUBLE PRECISION NOT NULL,
              stock INTEGER DEFAULT 0
            );
            CREATE PUBLICATION varpulis_pub FOR TABLE orders, products;
          "
      - name: Run CDC E2E tests
        run: cargo test -p varpulis-runtime --features cdc --test cdc_e2e -- --nocapture --test-threads=1
        env:
          CDC_TEST_HOST: localhost
          CDC_TEST_PORT: 5432

  # ---------------------------------------------------------------------
  # Broker-backed connector gates.
  #
  # Each of these tests was written as the fail-before/pass-after gate for a
  # merged connector fix, and each used to print "[skip]" and return green when
  # no broker was present — which was always, because no CI job provided one.
  # They now honour VARPULIS_REQUIRE_BROKERS=1: with the flag set, an
  # unreachable broker FAILS instead of abstaining, so these jobs cannot go
  # green without the fix actually being exercised.
  # ---------------------------------------------------------------------------
  redis-e2e:
    name: Redis Connector E2E
    needs: [check]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: redis-e2e
      # Gates: the pub/sub source must reconnect + re-subscribe after the server
      # drops its connection, and the sink must honour a dynamic .to(topic).
      - name: Redis connector gates
        run: cargo test -p varpulis-connector-redis --lib -- --nocapture --test-threads=1
        env:
          VARPULIS_REQUIRE_BROKERS: "1"
          VARPULIS_TEST_REDIS_URL: redis://127.0.0.1:6379

  mqtt-e2e:
    name: MQTT Connector E2E
    needs: [check]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mqtt-e2e
      # Not a `services:` container: the test restarts the broker by name to
      # force a reconnect, so it must own a container called `varpulis-mosq`.
      - name: Start mosquitto (container varpulis-mosq)
        run: |
          printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > /tmp/mosquitto.conf
          docker run -d --name varpulis-mosq -p 1883:1883 \
            -v /tmp/mosquitto.conf:/mosquitto/config/mosquitto.conf \
            eclipse-mosquitto:2
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1883) 2>/dev/null; then echo "broker up"; exit 0; fi
            sleep 1
          done
          echo "::error::mosquitto did not come up"; docker logs varpulis-mosq; exit 1
      - name: MQTT connector gates
        run: cargo test -p varpulis-connector-mqtt --lib -- --nocapture --test-threads=1
        env:
          VARPULIS_REQUIRE_BROKERS: "1"
      - name: Stop mosquitto
        if: always()
        run: docker rm -f varpulis-mosq || true

  pulsar-e2e:
    name: Pulsar Connector E2E
    needs: [check]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: pulsar-e2e
      - name: Install connector system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Same reason as mosquitto: the reconnect gate restarts this container by
      # name mid-test, so it cannot be a `services:` entry.
      - name: Start Pulsar standalone (container varpulis-pulsar)
        run: |
          docker run -d --name varpulis-pulsar -p 6650:6650 -p 8080:8080 \
            -e PULSAR_MEM="-Xms512m -Xmx1g" \
            apachepulsar/pulsar:4.0.13 bin/pulsar standalone
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/admin/v2/brokers/health >/dev/null; then
              echo "broker healthy"; exit 0
            fi
            sleep 5
          done
          echo "::error::pulsar did not become healthy"; docker logs --tail 100 varpulis-pulsar; exit 1
      - name: Pulsar connector gates
        run: cargo test -p varpulis-connector-pulsar --lib -- --nocapture --test-threads=1
        env:
          VARPULIS_REQUIRE_BROKERS: "1"
          VARPULIS_TEST_PULSAR_URL: pulsar://127.0.0.1:6650
          VARPULIS_TEST_PULSAR_CONTAINER: varpulis-pulsar
          VARPULIS_TEST_PULSAR_ADMIN: http://127.0.0.1:8080
      - name: Stop Pulsar
        if: always()
        run: docker rm -f varpulis-pulsar || true

  cdc-tls-e2e:
    name: CDC TLS E2E
    needs: [check]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cdc-tls-e2e
      # A PostgreSQL whose pg_hba.conf has no plain `host` line, presenting a
      # self-signed cert. That combination is what makes the three TLS gates
      # real: `require` can only succeed via genuine TLS, and `verify-full` must
      # reject the untrusted cert unless the cert is pinned as the CA.
      - name: Start TLS-only PostgreSQL on 5433
        run: |
          bash tests/integration/pg-tls/generate-certs.sh
          docker compose -f tests/integration/docker-compose.pg-tls.yml up -d
          for i in $(seq 1 40); do
            if docker exec varpulis-pg-tls pg_isready -h /var/run/postgresql -U postgres >/dev/null 2>&1; then
              echo "postgres up"; exit 0
            fi
            sleep 2
          done
          echo "::error::TLS postgres did not come up"; docker logs --tail 100 varpulis-pg-tls; exit 1
      - name: CDC TLS gates
        run: cargo test -p varpulis-connector-cdc --lib tls_integration -- --nocapture --test-threads=1
        env:
          VARPULIS_REQUIRE_BROKERS: "1"
          VARPULIS_TLS_PG_HOST: localhost
          VARPULIS_TLS_PG_PORT: "5433"
          VARPULIS_TLS_PG_CA: ${{ github.workspace }}/tests/integration/pg-tls/ca.crt
      - name: Stop TLS PostgreSQL
        if: always()
        run: docker compose -f tests/integration/docker-compose.pg-tls.yml down -v || true

  nats-e2e:
    name: NATS E2E
    needs: [check]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      nats:
        image: nats:latest
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nats-e2e
      - name: Runtime NATS E2E tests
        run: cargo test -p varpulis-runtime --features nats --test nats_e2e -- --nocapture
      - name: Cluster NATS E2E tests
        run: cargo test -p varpulis-cluster --features nats-transport --test nats_cluster_e2e -- --nocapture
      - name: Multi-worker NATS E2E tests
        run: cargo test -p varpulis-cluster --features nats-transport --test nats_multi_worker_e2e -- --nocapture
      # The C5 heartbeat-replication gate. It was written against a real broker
      # and then never wired into any job, so it had never run in CI.
      - name: NATS heartbeat replication gate
        run: cargo test -p varpulis-cluster --features raft,nats-transport --test nats_heartbeat_replication -- --nocapture
      # The JetStream gates need a JetStream-ENABLED server. The `nats:latest`
      # service container above runs without `-js`, and a GitHub `services:`
      # block cannot override the image command — so start a second broker
      # explicitly on 4224. `VARPULIS_REQUIRE_BROKERS=1` makes an unreachable
      # broker a hard failure: these gates must never pass by abstaining.
      - name: Start JetStream-enabled NATS
        run: docker run -d --name nats-js -p 4224:4222 nats:latest -js
      - name: JetStream routing + heartbeat durability gates
        run: cargo test -p varpulis-cluster --features nats-transport --test nats_jetstream_routing -- --nocapture --test-threads=1
        env:
          VARPULIS_REQUIRE_BROKERS: "1"
          VARPULIS_TEST_NATS_JS_URL: nats://127.0.0.1:4224
          # The service container above runs without `-js`; it is the
          # core-only server the no-silent-fallback gate needs.
          VARPULIS_TEST_NATS_CORE_URL: nats://127.0.0.1:4222
      - name: Stop JetStream-enabled NATS
        if: always()
        run: docker rm -f nats-js || true
