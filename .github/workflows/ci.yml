name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: Deny (licenses & advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  feature-flags:
    name: Feature Flags (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - kafka
          - raft
          - persistent
          - k8s
          - binary-codec
          - nats
          - mqtt
          - database
          - redis
          - elasticsearch
          - s3
          - kinesis
          - onnx
          - pulsar
          - gpu
          - federation
          - cdc
          - encryption
          - oidc
          - all-connectors
        include:
          - features: kafka
            apt-packages: libcurl4-openssl-dev
          - features: elasticsearch
            apt-packages: libssl-dev
          - features: onnx
            apt-packages: libssl-dev
          - features: gpu
            apt-packages: libssl-dev
          - features: pulsar
            apt-packages: protobuf-compiler
          - features: all-connectors
            apt-packages: libcurl4-openssl-dev libssl-dev protobuf-compiler
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.features }}
      - name: Install system dependencies
        if: matrix.apt-packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt-packages }}
      - run: cargo check --workspace --features ${{ matrix.features }}
      - run: cargo clippy --workspace --all-targets --features ${{ matrix.features }} -- -D warnings

  chaos-tests:
    name: Chaos Tests
    runs-on: ubuntu-latest
    needs: [check, test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: chaos
      - name: Build release binary
        run: cargo build --release -p varpulis-cli
      - name: Run chaos tests with retry
        run: ./scripts/run-chaos-tests.sh 2
        env:
          VARPULIS_BIN: ${{ github.workspace }}/target/release/varpulis

  web-ui:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: cd web-ui && npm ci
      - run: cd web-ui && npm audit --audit-level=high
      - run: cd web-ui && npm run type-check
      - run: cd web-ui && npm run test:unit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  cdc-e2e:
    name: CDC E2E
    runs-on: ubuntu-latest
    needs: [check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: varpulis
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: cdc_test
        options: >-
          --health-cmd "pg_isready -U varpulis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cdc-e2e
      - name: Configure PostgreSQL for logical replication
        run: |
          docker exec ${{ job.services.postgres.id }} sh -c "
            echo 'wal_level = logical' >> /var/lib/postgresql/data/postgresql.conf
            echo 'max_replication_slots = 4' >> /var/lib/postgresql/data/postgresql.conf
            echo 'max_wal_senders = 4' >> /var/lib/postgresql/data/postgresql.conf
          "
          docker restart ${{ job.services.postgres.id }}
          sleep 5
          # Wait for PostgreSQL to be ready after restart
          for i in $(seq 1 30); do
            pg_isready -h localhost -U varpulis -d cdc_test && break
            sleep 2
          done
      - name: Create test tables and publication
        run: |
          PGPASSWORD=testpass psql -h localhost -U varpulis -d cdc_test -c "
            CREATE TABLE IF NOT EXISTS orders (
              id SERIAL PRIMARY KEY,
              customer TEXT NOT NULL,
              amount DOUBLE PRECISION NOT NULL,
              status TEXT DEFAULT 'pending'
            );
            CREATE TABLE IF NOT EXISTS products (
              id SERIAL PRIMARY KEY,
              name TEXT NOT NULL,
              price DOUBLE PRECISION NOT NULL,
              stock INTEGER DEFAULT 0
            );
            CREATE PUBLICATION varpulis_pub FOR TABLE orders, products;
          "
      - name: Run CDC E2E tests
        run: cargo test -p varpulis-runtime --features cdc --test cdc_e2e -- --nocapture --test-threads=1
        env:
          CDC_TEST_HOST: localhost
          CDC_TEST_PORT: 5432

  nats-e2e:
    name: NATS E2E
    runs-on: ubuntu-latest
    needs: [check]
    services:
      nats:
        image: nats:latest
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nats-e2e
      - name: Runtime NATS E2E tests
        run: cargo test -p varpulis-runtime --features nats --test nats_e2e -- --nocapture
      - name: Cluster NATS E2E tests
        run: cargo test -p varpulis-cluster --features nats-transport --test nats_cluster_e2e -- --nocapture
      - name: Multi-worker NATS E2E tests
        run: cargo test -p varpulis-cluster --features nats-transport --test nats_multi_worker_e2e -- --nocapture
