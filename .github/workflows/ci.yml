name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Nightly full run + manual "run now" button. The heavy suite (matrix,
  # cross-platform, E2E, chaos, coverage) is gated to these events + release
  # tags via each job's `if:` below, so ordinary PRs only pay the fast gate.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# A push to a PR branch supersedes the in-flight run — cancel it instead of
# finishing the matrix for a commit nobody will merge. Runs on main
# are never cancelled so every merged commit keeps a complete CI record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Tiered CI:
#   * Fast gate (fmt, clippy, check, test, deny, audit, machete,
#     feature-matrix-check, unreachable-modules, documented-env, +semver on
#     PRs) runs on every
#     push/PR — this is what you watch before merging.
#   * Heavy suite (msrv, cross-platform, feature-flags matrix, wasm, coverage,
#     doc, chaos, CDC/NATS/Kafka E2E) is gated by `HEAVY` below to: the nightly
#     schedule, manual `workflow_dispatch`, and release tags (`refs/tags/*`).
#     It does NOT run per-PR, so PR feedback is ~5 min instead of ~15.
# Anchor for the heavy-job gate (kept as a comment so it stays in one place):
#   github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
#     || startsWith(github.ref, 'refs/tags/')

jobs:
  # Gate job: skip entire CI for Dependabot PRs to conserve Actions minutes.
  # Dependabot PRs are validated on merge to main instead.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.actor != 'dependabot[bot]'
    steps:
      - run: echo "CI gate passed"

  msrv:
    name: MSRV (1.93)
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo test --workspace

  check:
    name: Check
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc

  cross-platform:
    name: ${{ matrix.os }}
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Check and test (exclude connectors needing system libs)
        run: |
          cargo check --workspace
          cargo test --workspace

  # fmt / clippy / audit / deny are thin CI wrappers around scripts/verify.sh:
  # the script is the single source of truth for what these gates run, so a
  # green local `./scripts/verify.sh` should keep CI green. CI-specific bits
  # (toolchain install, cache, cargo-audit/deny install) stay inline.
  fmt:
    name: Format
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Run verify.sh (fmt only)
        run: bash scripts/verify.sh
        env:
          SKIP_CLIPPY: "1"
          SKIP_AUDIT: "1"
          SKIP_DENY: "1"
          # CI has a Documentation job of its own; this step is for the
          # author's machine, where the pre-push hook runs the whole suite.
          SKIP_DOC: "1"

  clippy:
    name: Clippy
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run verify.sh (clippy only)
        run: bash scripts/verify.sh
        env:
          SKIP_FMT: "1"
          SKIP_AUDIT: "1"
          SKIP_DENY: "1"
          # CI has a Documentation job of its own; this step is for the
          # author's machine, where the pre-push hook runs the whole suite.
          SKIP_DOC: "1"

  deny:
    name: Deny (licenses & advisories)
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.6
      - name: Run verify.sh (deny only)
        run: bash scripts/verify.sh
        env:
          SKIP_FMT: "1"
          SKIP_CLIPPY: "1"
          SKIP_AUDIT: "1"
          # CI has a Documentation job of its own; this step is for the
          # author's machine, where the pre-push hook runs the whole suite.
          SKIP_DOC: "1"

  audit:
    name: Audit
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run verify.sh (audit only)
        run: bash scripts/verify.sh
        env:
          SKIP_FMT: "1"
          SKIP_CLIPPY: "1"
          SKIP_DENY: "1"
          # CI has a Documentation job of its own; this step is for the
          # author's machine, where the pre-push hook runs the whole suite.
          SKIP_DOC: "1"

  machete:
    name: Unused Dependencies
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - run: cargo machete

  engine-runtime-free:
    name: Engine Stays Runtime-Free
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # varpulis-engine is the part of Varpulis that embeds in a process with no
    # async runtime (Vejas ADR-0031). A dependency on tokio, a broker client or
    # a server stack sneaking into its tree would compile without a word and
    # undo that. `cargo tree` resolves the lockfile without building, so this
    # needs no system libraries.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/check-engine-deps.py

  documented-env:
    name: Documented Settings Are Read
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `VARPULIS_ENCRYPTION_PASSPHRASE` had a tutorial section of its own and no
    # Rust code read it, so checkpoints were written in plaintext for anyone who
    # followed the tutorial exactly. Documentation promising a control the
    # binary does not implement is the worst version of that failure, because
    # the reader has no way to tell.
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-documented-env.py

  unreachable-modules:
    name: Every Module Is Reachable
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On the fast path: it is a filesystem walk, and the thing it catches is
    # invisible to every other job by construction. `cargo check` cannot report
    # a file it never compiles.
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/find-unreachable-modules.py

  feature-matrix-check:
    name: Feature Matrix Is Honest
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On the fast path on purpose. The generator refuses to run when its SKIP
    # table names a feature no crate declares, or excuses one as default-on
    # that is not actually in any default set. Both are ways coverage silently
    # shrinks, and both are worth catching on the PR rather than at 03:00.
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/feature-matrix.py > /dev/null

  semver:
    name: Semver Checks
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # PR-only: needs the PR base commit as its semver baseline. Stays on the
    # fast path because it is the cheapest place to catch an accidental public
    # API break, and it is scoped to the four externally-consumed crates.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: semver
      # semver-checks rustdoc-builds crates with --all-features, which
      # reaches rdkafka-sys (needs curl/zlib headers) and pulsar (needs
      # protoc). Without these the job dies on build errors before ever
      # evaluating an API — which is how it silently rotted: it only
      # triggers on non-dependabot PRs, and those were rare.
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      # Scoped to the crates external consumers depend on: the engine
      # surface (core/runtime/parser) and the connector SDK. A full
      # --workspace pass rustdoc-builds all ~35 crates twice and blew
      # through 90 minutes on a hosted runner; the internal crates it
      # would add are not a public contract.
      - name: Check semver compliance
        run: >-
          cargo semver-checks
          --package varpulis-core
          --package varpulis-runtime
          --package varpulis-parser
          --package varpulis-connector-api
          --baseline-rev ${{ github.event.pull_request.base.sha }}

  feature-matrix:
    name: Feature Matrix
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      features: ${{ steps.generate.outputs.features }}
    steps:
      - uses: actions/checkout@v7
      # The list below used to be hand-written in this file, and it drifted:
      # `saas` was never added, so varpulis-cli's test targets stopped
      # compiling under it and no job noticed. Deriving the matrix from the
      # manifests makes that drift impossible — a new feature is covered on
      # the next run, and leaving one out costs a justified entry in the
      # script's SKIP table.
      # Deliberately not `echo "features=$(...)"`: a command substitution
      # inside an argument swallows the generator's exit status, so a broken
      # script would emit an empty matrix and the whole feature suite would
      # vanish without a red job. That is the failure mode this file is being
      # changed to remove, so the generator's status is checked directly.
      - id: generate
        run: |
          python3 scripts/feature-matrix.py > matrix.json
          test -s matrix.json
          echo "features=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "$(python3 -c 'import json;print(len(json.load(open("matrix.json"))))') features will be verified" >> "$GITHUB_STEP_SUMMARY"

  feature-flags:
    name: Feature Flags (${{ matrix.name }})
    needs: [feature-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.feature-matrix.outputs.features) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.feature }}
      # Workspace-wide, because enabling a feature changes feature unification
      # for every crate that shares a dependency with the ones declaring it.
      - run: cargo check --workspace --features ${{ matrix.feature }}
      # Scoped to the declaring crates, because this is the expensive half and
      # `--all-targets` is the half that matters: it compiles tests, benches
      # and examples, which is exactly what had rotted under `saas`.
      #
      # `matrix.feature` is a comma-separated list, not always a single name:
      # the generator also emits an entry per feature *combination* that some
      # `cfg(all(...))` requires. One feature at a time cannot reach that code
      # — with only half the combination on, the item is compiled out and
      # clippy lints nothing there and reports success.
      - run: cargo clippy ${{ matrix.packages }} --all-targets --features ${{ matrix.feature }} -- -D warnings

  wasm:
    name: WASM Build
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Check WASM build
        run: cargo check -p varpulis-wasm --target wasm32-unknown-unknown
      # varpulis-engine-wasm is the crate that actually compiles the engine to
      # wasm: it takes varpulis-runtime with `default-features = false,
      # features = ["wasm"]`. A workspace build never produces that
      # configuration — feature unification hands it the async-enabled runtime
      # that some other member asked for — so it has to be built on its own,
      # which is what `-p` does here. varpulis-wasm above depends on
      # varpulis-core and varpulis-parser only, and so checks none of this.
      - name: Check the engine compiled to WASM
        run: cargo check -p varpulis-engine-wasm --target wasm32-unknown-unknown
      # The same runtime configuration on the host target, where a compile
      # error is legible without a wasm toolchain in the way. This is also the
      # configuration `crates/varpulis-runtime/fuzz` builds against, so a break
      # here is a break in the nightly fuzz run.
      - name: Check varpulis-runtime without default features
        run: cargo check -p varpulis-runtime --no-default-features

  coverage:
    name: Coverage
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk-space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  doc:
    name: Documentation
    needs: [gate]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

