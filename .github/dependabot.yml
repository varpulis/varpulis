version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps):"

  - package-ecosystem: npm
    directory: /web-ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"
