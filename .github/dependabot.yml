version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"
    groups:
      rust-patch:
        update-types: ["version-update:semver-patch"]
      rust-minor:
        update-types: ["version-update:semver-minor"]
      rust-major:
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps):"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web-ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"
    groups:
      npm-patch:
        update-types: ["version-update:semver-patch"]
      npm-minor:
        update-types: ["version-update:semver-minor"]
      npm-major:
        update-types: ["version-update:semver-major"]
