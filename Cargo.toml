[workspace]
resolver = "2"
members = [
    "crates/varpulis-actors",
    "crates/varpulis-connector-api",
    "crates/varpulis-connector-cdc",
    "crates/varpulis-connector-database",
    "crates/varpulis-connector-elasticsearch",
    "crates/varpulis-connector-http",
    "crates/varpulis-connector-kafka",
    "crates/varpulis-connector-kinesis",
    "crates/varpulis-connector-mqtt",
    "crates/varpulis-connector-nats",
    "crates/varpulis-connector-pulsar",
    "crates/varpulis-connector-redis",
    "crates/varpulis-connector-s3",
    "crates/varpulis-connectors",
    "crates/varpulis-core",
    "crates/varpulis-parser",
    "crates/varpulis-sase",
    "crates/varpulis-runtime",
    "crates/varpulis-cli",
    "crates/varpulis-zdd",
    "crates/varpulis-lsp",
    "crates/varpulis-cluster",
    "crates/varpulis-mcp",
    "crates/varpulis-wasm",
    "crates/varpulis-datagen",
    "crates/varpulis-db",
    "crates/varpulis-pst",
    "crates/varpulis-hamlet",
    "crates/varpulis-enrichment",
    "crates/varpulis-simd",
    "crates/varpulis-dead-letter",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.93"
authors = ["Varpulis Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/varpulis/varpulis"
homepage = "https://www.varpulis-cep.com"
documentation = "https://docs.varpulis-cep.com"
description = "A modern streaming analytics engine with advanced pattern detection"

[workspace.dependencies]
# Parsing
logos = "0.16"

# Async runtime
tokio = { version = "1.50", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
schemars = { version = "1", features = ["indexmap2"] }

# Error handling
thiserror = "2"
anyhow = "1.0"
miette = "7"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Collections
indexmap = { version = "2.1", features = ["serde"] }
inventory = "0.3"
smallvec = "1.13"
rustc-hash = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Metrics
prometheus = { version = "0.14", default-features = false }

# OpenTelemetry (opt-in via "otel" feature)
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["tonic"] }
tracing-opentelemetry = "0.32"

# Random
rand = "0.10"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Web framework
axum = { version = "0.8", features = ["ws", "json", "macros"] }
axum-extra = "0.10"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"

# Actor framework
varpulis-actors = { version = "0.8.0", path = "crates/varpulis-actors" }

# OAuth & JWT
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Secrets
zeroize = { version = "1.8", features = ["derive"] }

# Crypto (HMAC for Stripe webhooks)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Testing
pretty_assertions = "1.4"
insta = { version = "1", features = ["yaml"] }
iai-callgrind = "0.16"

# ---------------------------------------------------------------------------
# Duplicate dependency note
# ---------------------------------------------------------------------------
# `cargo deny check bans` reports duplicate entries. Root causes:
#
# 1. lsp-types 0.94 pins bitflags 1.x (everything else uses 2.x).
#
# 2. pulsar 6.7 brings in async-std (unmaintained). Feature-gated.
#
# 3. (Resolved) Production and dev-deps now both use rand 0.9.
#
# These are all transitive and cannot be resolved without major crate migrations.

# ---------------------------------------------------------------------------
# Workspace-wide lint configuration
# ---------------------------------------------------------------------------
# Every member crate inherits these via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# Enable pedantic and nursery groups at warn (lower priority so individual
# overrides take effect).
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# ---------------------------------------------------------------------------
# Individual overrides — allowed for now, tighten over time
# ---------------------------------------------------------------------------
# These lints are from pedantic/nursery but have too many existing violations
# to enable at once. Each should be addressed in a dedicated cleanup PR.

# Safety & correctness (aspirational — ~2500 existing uses; see #102)
# Cannot set to "warn" until unwrap→expect migration is done, since CI uses -D warnings.
unwrap_used = "allow"

# Style & readability — allowed pending dedicated cleanup
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
similar_names = "allow"
if_not_else = "allow"
redundant_closure_for_method_calls = "allow"
single_match_else = "allow"
unnested_or_patterns = "allow"
unreadable_literal = "allow"
wildcard_imports = "allow"
implicit_hasher = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"

# Casts — allow all cast lints (numeric code is pervasive)
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"

# Bool parameters
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"

# Remaining pedantic/nursery lints with existing violations
option_if_let_else = "allow"
match_same_arms = "allow"
needless_collect = "allow"
missing_const_for_fn = "allow"
float_cmp = "allow"
used_underscore_binding = "allow"
significant_drop_tightening = "allow"
manual_let_else = "allow"
default_trait_access = "allow"
redundant_pub_crate = "allow"
needless_continue = "allow"
comparison_chain = "allow"
format_push_string = "allow"
literal_string_with_formatting_args = "allow"
unnecessary_wraps = "allow"
assigning_clones = "allow"
unused_self = "allow"
ref_option = "allow"
needless_pass_by_ref_mut = "allow"
match_wildcard_for_single_variants = "allow"
no_effect_underscore_binding = "allow"
unused_async = "allow"
missing_fields_in_debug = "allow"
use_self = "allow"
map_unwrap_or = "allow"
uninlined_format_args = "allow"
unnecessary_literal_bound = "allow"
suboptimal_flops = "allow"
manual_string_new = "allow"
suspicious_operation_groupings = "allow"
iter_without_into_iter = "allow"
collection_is_never_read = "allow"
or_fun_call = "allow"
unchecked_time_subtraction = "allow"
ignore_without_reason = "allow"
future_not_send = "allow"
branches_sharing_code = "allow"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
