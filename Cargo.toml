[workspace]
resolver = "2"
members = [
    "crates/varpulis-actors",
    "crates/varpulis-core",
    "crates/varpulis-parser",
    "crates/varpulis-runtime",
    "crates/varpulis-cli",
    "crates/varpulis-zdd",
    "crates/varpulis-lsp",
    "crates/varpulis-cluster",
    "crates/varpulis-mcp",
    "crates/varpulis-wasm",
    "crates/varpulis-datagen",
    "crates/varpulis-db",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
authors = ["Varpulis Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/varpulis/varpulis"
description = "A modern streaming analytics engine with advanced pattern detection"

[workspace.dependencies]
# Parsing
logos = "0.14"

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Collections
indexmap = { version = "2.1", features = ["serde"] }
inventory = "0.3"
smallvec = "1.11"
rustc-hash = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Metrics
prometheus = { version = "0.14", default-features = false }

# OpenTelemetry (opt-in via "otel" feature)
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["tonic"] }
tracing-opentelemetry = "0.32"

# Random
rand = "0.8"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Web (warp kept only for varpulis-runtime HTTP connector; CLI + cluster use axum)
warp = { version = "0.3", features = ["tls"] }
axum = { version = "0.8", features = ["ws", "json", "macros"] }
axum-extra = "0.10"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures-util = "0.3"

# Actor framework
varpulis-actors = { version = "0.4.1", path = "crates/varpulis-actors" }

# OAuth & JWT
jsonwebtoken = "9"

# Secrets
zeroize = { version = "1.8", features = ["derive"] }

# Crypto (HMAC for Stripe webhooks)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Testing
pretty_assertions = "1.4"

# ---------------------------------------------------------------------------
# Duplicate dependency note
# ---------------------------------------------------------------------------
# `cargo deny check bans` reports ~64 duplicate entries. Root causes:
#
# 1. warp 0.3.7 (now only in varpulis-runtime HTTP connector) pins hyper 0.14 /
#    http 0.2 / h2 0.3 / rustls 0.22 / base64 0.21. CLI + cluster migrated to
#    axum 0.8, reducing duplicates. Remaining: migrate runtime HTTP connector.
#
# 2. lsp-types 0.94 pins bitflags 1.x (everything else uses 2.x).
#
# 3. pulsar 6.7 brings in async-std (unmaintained). Feature-gated.
#
# 4. Dev-deps (proptest) pull rand 0.9 while production uses rand 0.8.
#
# These are all transitive and cannot be resolved without major crate migrations.

[profile.release]
lto = true
codegen-units = 1
