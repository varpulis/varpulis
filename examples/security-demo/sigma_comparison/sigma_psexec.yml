# Sigma Rule: PsExec Execution (for reference — NOT executed by Varpulis)
# Source: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_sysinternals_psexec.yml
#
# This rule detects PsExec by matching the binary name in the Image field.
# It is trivially evaded by renaming the binary.

title: PsExec Execution
id: 730fc21b-eaff-474b-ad23-90fd265d4988
status: stable
description: Detects PsExec usage by matching the binary filename
references:
    - https://docs.microsoft.com/en-us/sysinternals/downloads/psexec
author: Security Demo
date: 2024/01/01
tags:
    - attack.execution
    - attack.t1569.002
    - attack.lateral_movement
    - attack.t1021.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        - Image|endswith: '\PsExec.exe'
        - Image|endswith: '\PsExec64.exe'
        - OriginalFileName: 'psexec.c'
    condition: selection
falsepositives:
    - Legitimate admin use of PsExec
level: high

# WHY THIS RULE IS BLIND:
#
# 1. String matching on filename: rename PsExec.exe → svcupdate.exe → rule misses it
# 2. No behavioral analysis: doesn't look at what the process DOES (SMB + remote service)
# 3. No temporal correlation: doesn't detect the attack pattern, only the tool name
# 4. OriginalFileName can be modified in the binary's PE header
#
# Varpulis detects the BEHAVIOR, not the NAME:
# SMB connection (port 445) → remote process via services.exe → command execution
# This works regardless of what the binary is called.
