server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location /docs/ {
        # VitePress clean URLs: try exact path, then with .html, then directory index
        try_files $uri $uri.html $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /docs/404.html;
}
