<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#777"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" fill="#ccc" font-weight="600" font-size="15">Pipeline Inheritance Flow</text>

  <!-- Global pipelines -->
  <rect x="240" y="40" width="240" height="60" rx="8" fill="#1a1a2e" stroke="#16213e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="62" text-anchor="middle" fill="#e0e0e0" font-weight="600" font-size="13">Global Pipelines</text>
  <text x="360" y="80" text-anchor="middle" fill="#888" font-size="11">scope_level: global | editable: admin only</text>

  <!-- Arrows down -->
  <line x1="280" y1="100" x2="160" y2="140" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="100" x2="560" y2="140" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Inherited badge on arrows -->
  <rect x="170" y="108" width="72" height="18" rx="9" fill="#1565c0"/>
  <text x="206" y="120" text-anchor="middle" fill="white" font-size="9" font-weight="500">READ-ONLY</text>
  <rect x="480" y="108" width="72" height="18" rx="9" fill="#1565c0"/>
  <text x="516" y="120" text-anchor="middle" fill="white" font-size="9" font-weight="500">READ-ONLY</text>

  <!-- Tenant A -->
  <rect x="40" y="140" width="240" height="80" rx="8" fill="#0f3460" stroke="#1a508b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="162" text-anchor="middle" fill="#e0e0e0" font-weight="600" font-size="13">Tenant A Pipelines</text>
  <rect x="55" y="172" width="90" height="20" rx="4" fill="#252545"/>
  <text x="100" y="186" text-anchor="middle" fill="#9e9e9e" font-size="10">GLOBAL</text>
  <rect x="155" y="172" width="110" height="20" rx="4" fill="#0a2a4a"/>
  <text x="210" y="186" text-anchor="middle" fill="#64b5f6" font-size="10">OWN (editable)</text>

  <!-- Tenant B -->
  <rect x="440" y="140" width="240" height="80" rx="8" fill="#0f3460" stroke="#1a508b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="162" text-anchor="middle" fill="#e0e0e0" font-weight="600" font-size="13">Tenant B Pipelines</text>
  <rect x="455" y="172" width="90" height="20" rx="4" fill="#252545"/>
  <text x="500" y="186" text-anchor="middle" fill="#9e9e9e" font-size="10">GLOBAL</text>
  <rect x="555" y="172" width="110" height="20" rx="4" fill="#0a2a4a"/>
  <text x="610" y="186" text-anchor="middle" fill="#64b5f6" font-size="10">OWN (editable)</text>

  <!-- Arrow tenant A -> sub-tenant -->
  <line x1="160" y1="220" x2="160" y2="260" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="100" y="232" width="72" height="18" rx="9" fill="#1565c0"/>
  <text x="136" y="244" text-anchor="middle" fill="white" font-size="9" font-weight="500">READ-ONLY</text>

  <!-- Sub-tenant A1 -->
  <rect x="40" y="260" width="240" height="60" rx="8" fill="#1b4332" stroke="#2d6a4f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="280" text-anchor="middle" fill="#e0e0e0" font-weight="500" font-size="13">Sub-tenant A1 Pipelines</text>
  <rect x="55" y="290" width="60" height="18" rx="4" fill="#252545"/>
  <text x="85" y="302" text-anchor="middle" fill="#9e9e9e" font-size="9">GLOBAL</text>
  <rect x="120" y="290" width="75" height="18" rx="4" fill="#1a3a5a"/>
  <text x="157" y="302" text-anchor="middle" fill="#64b5f6" font-size="9">INHERITED</text>
  <rect x="200" y="290" width="70" height="18" rx="4" fill="#0a2a4a"/>
  <text x="235" y="302" text-anchor="middle" fill="#81c784" font-size="9">OWN</text>
</svg>
