<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#616161"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1A73E8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="520" fill="#FFFFFF"/>

  <!-- Browser lifeline -->
  <rect x="40" y="16" width="120" height="32" rx="6" ry="6" fill="#1A73E8"/>
  <text x="100" y="37" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Browser</text>
  <line x1="100" y1="48" x2="100" y2="505" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Varpulis lifeline -->
  <rect x="275" y="16" width="140" height="32" rx="6" ry="6" fill="#1A73E8"/>
  <text x="345" y="37" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Varpulis</text>
  <line x1="345" y1="48" x2="345" y2="505" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- OIDC Provider lifeline -->
  <rect x="530" y="16" width="140" height="32" rx="6" ry="6" fill="#424242"/>
  <text x="600" y="37" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">OIDC Provider</text>
  <line x1="600" y1="48" x2="600" y2="505" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 1. GET /auth/oidc/login -->
  <line x1="105" y1="80" x2="339" y2="80" stroke="#616161" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="222" y="73" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#212121">GET /auth/oidc/login</text>

  <!-- 2. Discover endpoints -->
  <line x1="350" y1="108" x2="594" y2="108" stroke="#616161" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="472" y="101" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#212121">GET /.well-known/openid-config</text>

  <!-- 3. { endpoints } -->
  <line x1="594" y1="133" x2="350" y2="133" stroke="#1A73E8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="472" y="128" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#1A73E8">{ authorization_endpoint, ... }</text>

  <!-- 4. 302 redirect -->
  <line x1="339" y1="160" x2="105" y2="160" stroke="#1A73E8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="222" y="155" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#1A73E8">302 &#x2192; provider</text>

  <!-- 5. User authenticates -->
  <line x1="105" y1="195" x2="594" y2="195" stroke="#616161" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="350" y="188" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#212121">User authenticates</text>

  <!-- 6. 302 callback -->
  <line x1="594" y1="225" x2="105" y2="225" stroke="#1A73E8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="350" y="220" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#1A73E8">302 &#x2192; /auth/oidc/callback?code=xxx</text>

  <!-- 7. GET /auth/oidc/callback -->
  <line x1="105" y1="260" x2="339" y2="260" stroke="#616161" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="222" y="253" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#212121">GET /auth/oidc/callback</text>

  <!-- 8. POST /token -->
  <line x1="350" y1="290" x2="594" y2="290" stroke="#616161" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="472" y="283" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#212121">POST /token</text>

  <!-- 9. { id_token, access_token } -->
  <line x1="594" y1="315" x2="350" y2="315" stroke="#1A73E8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="472" y="310" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#1A73E8">{ id_token, access_token }</text>

  <!-- Validation box -->
  <rect x="353" y="330" width="180" height="80" rx="4" ry="4" fill="#E8F0FE" stroke="#424242" stroke-width="1"/>
  <text x="443" y="348" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="bold" fill="#212121">Validate id_token:</text>
  <text x="443" y="364" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9" fill="#757575">Verify signature</text>
  <text x="443" y="378" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9" fill="#757575">Check issuer</text>
  <text x="443" y="392" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9" fill="#757575">Check audience &amp; expiry</text>

  <!-- 10. Set-Cookie: jwt=... -->
  <line x1="339" y1="440" x2="105" y2="440" stroke="#1A73E8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="222" y="435" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#1A73E8">Set-Cookie: jwt=...</text>
</svg>
