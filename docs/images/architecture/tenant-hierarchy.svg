<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Global -->
  <rect x="260" y="20" width="200" height="50" rx="8" fill="#1a1a2e" stroke="#16213e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="42" text-anchor="middle" fill="#e0e0e0" font-weight="600" font-size="14">Global Org</text>
  <text x="360" y="58" text-anchor="middle" fill="#888" font-size="11">system admin</text>

  <!-- Connectors global -> tenants -->
  <line x1="300" y1="70" x2="140" y2="120" stroke="#555" stroke-width="1.5"/>
  <line x1="360" y1="70" x2="360" y2="120" stroke="#555" stroke-width="1.5"/>
  <line x1="420" y1="70" x2="580" y2="120" stroke="#555" stroke-width="1.5"/>

  <!-- Tenant A -->
  <rect x="40" y="120" width="200" height="70" rx="8" fill="#0f3460" stroke="#1a508b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="142" text-anchor="middle" fill="#e0e0e0" font-weight="600" font-size="14">Tenant A</text>
  <text x="140" y="158" text-anchor="middle" fill="#64b5f6" font-size="10">namespace: varpulis-tenant-a</text>
  <text x="140" y="172" text-anchor="middle" fill="#64b5f6" font-size="10">schema: tenant_acme | kafka: acme.*</text>

  <!-- Tenant B -->
  <rect x="260" y="120" width="200" height="70" rx="8" fill="#0f3460" stroke="#1a508b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="142" text-anchor="middle" fill="#e0e0e0" font-weight="600" font-size="14">Tenant B</text>
  <text x="360" y="158" text-anchor="middle" fill="#64b5f6" font-size="10">namespace: varpulis-tenant-b</text>
  <text x="360" y="172" text-anchor="middle" fill="#64b5f6" font-size="10">schema: tenant_bigco | kafka: bigco.*</text>

  <!-- Tenant C -->
  <rect x="480" y="120" width="200" height="70" rx="8" fill="#0f3460" stroke="#1a508b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="142" text-anchor="middle" fill="#e0e0e0" font-weight="600" font-size="14">Tenant C</text>
  <text x="580" y="158" text-anchor="middle" fill="#64b5f6" font-size="10">namespace: varpulis-tenant-c</text>
  <text x="580" y="172" text-anchor="middle" fill="#64b5f6" font-size="10">schema: tenant_corp | kafka: corp.*</text>

  <!-- Connectors tenant A -> sub-tenants -->
  <line x1="100" y1="190" x2="80" y2="240" stroke="#555" stroke-width="1.5"/>
  <line x1="180" y1="190" x2="220" y2="240" stroke="#555" stroke-width="1.5"/>

  <!-- Connector tenant B -> sub-tenant -->
  <line x1="360" y1="190" x2="360" y2="240" stroke="#555" stroke-width="1.5"/>

  <!-- Sub-tenant A1 -->
  <rect x="10" y="240" width="160" height="60" rx="8" fill="#1b4332" stroke="#2d6a4f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="90" y="262" text-anchor="middle" fill="#e0e0e0" font-weight="500" font-size="13">Sub-tenant A1</text>
  <text x="90" y="280" text-anchor="middle" fill="#81c784" font-size="10">shares parent infra</text>

  <!-- Sub-tenant A2 -->
  <rect x="180" y="240" width="160" height="60" rx="8" fill="#1b4332" stroke="#2d6a4f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="260" y="262" text-anchor="middle" fill="#e0e0e0" font-weight="500" font-size="13">Sub-tenant A2</text>
  <text x="260" y="280" text-anchor="middle" fill="#81c784" font-size="10">shares parent infra</text>

  <!-- Sub-tenant B1 -->
  <rect x="290" y="240" width="160" height="60" rx="8" fill="#1b4332" stroke="#2d6a4f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="262" text-anchor="middle" fill="#e0e0e0" font-weight="500" font-size="13">Sub-tenant B1</text>
  <text x="370" y="280" text-anchor="middle" fill="#81c784" font-size="10">shares parent infra</text>

  <!-- Legend -->
  <rect x="20" y="330" width="680" height="55" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
  <rect x="40" y="347" width="16" height="16" rx="3" fill="#1a1a2e" stroke="#16213e"/>
  <text x="62" y="359" fill="#aaa" font-size="11">Global (system admin)</text>
  <rect x="210" y="347" width="16" height="16" rx="3" fill="#0f3460" stroke="#1a508b"/>
  <text x="232" y="359" fill="#aaa" font-size="11">Tenant (own namespace, schema, Kafka)</text>
  <rect x="490" y="347" width="16" height="16" rx="3" fill="#1b4332" stroke="#2d6a4f"/>
  <text x="512" y="359" fill="#aaa" font-size="11">Sub-tenant (inherits parent)</text>
</svg>
