<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#616161"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="260" fill="#FFFFFF"/>

  <!-- AuthProvider trait box -->
  <rect x="195" y="16" width="210" height="44" rx="6" ry="6" fill="#1A73E8"/>
  <text x="300" y="36" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">AuthProvider</text>
  <text x="300" y="52" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#B3D4FC">(trait)</text>

  <!-- Left branch arrow -->
  <line x1="260" y1="60" x2="160" y2="88" stroke="#616161" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Right branch arrow -->
  <line x1="340" y1="60" x2="440" y2="88" stroke="#616161" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- GitHubProvider box -->
  <rect x="60" y="90" width="200" height="52" rx="6" ry="6" fill="#E8F0FE" stroke="#424242" stroke-width="1.5"/>
  <text x="160" y="113" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#212121">GitHubProvider</text>
  <text x="160" y="130" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#757575">(default SaaS)</text>

  <!-- OidcProvider box -->
  <rect x="340" y="90" width="200" height="52" rx="6" ry="6" fill="#E8F0FE" stroke="#424242" stroke-width="1.5"/>
  <text x="440" y="113" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#212121">OidcProvider</text>
  <text x="440" y="130" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#757575">(--features oidc)</text>

  <!-- Left converge arrow -->
  <line x1="160" y1="142" x2="230" y2="178" stroke="#616161" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Right converge arrow -->
  <line x1="440" y1="142" x2="370" y2="178" stroke="#616161" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- JWT Session Layer box -->
  <rect x="100" y="180" width="400" height="56" rx="6" ry="6" fill="#FFF3E0" stroke="#424242" stroke-width="1.5"/>
  <text x="300" y="204" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#212121">JWT Session Layer</text>
  <text x="300" y="224" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#757575">7-day expiry, HMAC-SHA256, HttpOnly cookie</text>
</svg>
