<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- K8s cluster box -->
  <rect x="10" y="10" width="700" height="290" rx="10" fill="none" stroke="#326ce5" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="30" y="32" fill="#326ce5" font-weight="600" font-size="12">Kubernetes Cluster</text>

  <!-- Global namespace -->
  <rect x="30" y="50" width="200" height="110" rx="8" fill="#1a1a2e" stroke="#16213e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="72" text-anchor="middle" fill="#e0e0e0" font-weight="600" font-size="12">varpulis-global</text>
  <rect x="45" y="82" width="170" height="24" rx="4" fill="#252545"/>
  <text x="130" y="98" text-anchor="middle" fill="#aaa" font-size="11">Coordinator + Admin API</text>
  <rect x="45" y="112" width="170" height="24" rx="4" fill="#252545"/>
  <text x="130" y="128" text-anchor="middle" fill="#aaa" font-size="11">Workers + Monitoring</text>

  <!-- Tenant A namespace -->
  <rect x="250" y="50" width="200" height="110" rx="8" fill="#0f3460" stroke="#1a508b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="72" text-anchor="middle" fill="#e0e0e0" font-weight="600" font-size="12">varpulis-tenant-acme</text>
  <rect x="265" y="82" width="170" height="24" rx="4" fill="#0a2a4a"/>
  <text x="350" y="98" text-anchor="middle" fill="#64b5f6" font-size="11">Coordinator + Workers</text>
  <rect x="265" y="112" width="170" height="24" rx="4" fill="#0a2a4a"/>
  <text x="350" y="128" text-anchor="middle" fill="#64b5f6" font-size="11">Connectors</text>

  <!-- Tenant B namespace -->
  <rect x="470" y="50" width="220" height="110" rx="8" fill="#0f3460" stroke="#1a508b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="72" text-anchor="middle" fill="#e0e0e0" font-weight="600" font-size="12">varpulis-tenant-bigco</text>
  <rect x="485" y="82" width="190" height="24" rx="4" fill="#0a2a4a"/>
  <text x="580" y="98" text-anchor="middle" fill="#64b5f6" font-size="11">Coordinator + Workers</text>
  <rect x="485" y="112" width="190" height="24" rx="4" fill="#0a2a4a"/>
  <text x="580" y="128" text-anchor="middle" fill="#64b5f6" font-size="11">Connectors</text>

  <!-- Sub-tenants sharing namespace -->
  <rect x="250" y="180" width="200" height="60" rx="6" fill="#1b4332" stroke="#2d6a4f" stroke-width="1" filter="url(#shadow)"/>
  <text x="350" y="200" text-anchor="middle" fill="#e0e0e0" font-size="12">Sub-tenant A1</text>
  <text x="350" y="218" text-anchor="middle" fill="#81c784" font-size="10">shares varpulis-tenant-acme</text>

  <rect x="250" y="248" width="200" height="40" rx="6" fill="#1b4332" stroke="#2d6a4f" stroke-width="1" filter="url(#shadow)"/>
  <text x="350" y="272" text-anchor="middle" fill="#e0e0e0" font-size="12">Sub-tenant A2</text>

  <!-- NetworkPolicy indicator -->
  <rect x="470" y="180" width="220" height="50" rx="6" fill="#3e1a1a" stroke="#6b3030" stroke-width="1" filter="url(#shadow)"/>
  <text x="580" y="200" text-anchor="middle" fill="#ef9a9a" font-weight="500" font-size="11">NetworkPolicy: default-deny</text>
  <text x="580" y="216" text-anchor="middle" fill="#ef9a9a" font-size="10">per-namespace ingress/egress rules</text>

  <!-- Arrow from sub to parent namespace -->
  <line x1="350" y1="180" x2="350" y2="160" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="4,2"/>
</svg>
