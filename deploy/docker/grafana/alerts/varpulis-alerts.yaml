groups:
  - name: varpulis
    rules:
      - alert: HighProcessingLatency
        expr: histogram_quantile(0.99, rate(varpulis_processing_latency_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High event processing latency (p99 > 1s)"

      - alert: ConnectorUnhealthy
        expr: varpulis_connector_health == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Connector {{ $labels.connector }} is unhealthy"

      - alert: DLQGrowing
        expr: rate(varpulis_dlq_events_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Dead letter queue receiving events"

      - alert: BackpressureDrops
        expr: rate(varpulis_backpressure_drops[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Events being dropped due to backpressure"
