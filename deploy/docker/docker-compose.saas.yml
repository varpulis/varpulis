# Varpulis CEP — SaaS Deployment
#
# Full stack with PostgreSQL, GitHub OAuth, Stripe billing, and monitoring.
# Includes the Web UI (Vue SPA) served via Caddy reverse proxy.
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in all values
#   2. Create a GitHub OAuth App (https://github.com/settings/developers)
#   3. Create Stripe products/prices (https://dashboard.stripe.com)
#
# Usage:
#   docker compose -f docker-compose.saas.yml build
#   docker compose -f docker-compose.saas.yml up -d

services:
  # ─── PostgreSQL (user/org/billing DB) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: varpulis-postgres
    environment:
      POSTGRES_USER: varpulis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: varpulis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varpulis"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - varpulis-net

  # ─── Varpulis CEP Server (SaaS mode) ─────────────────────────
  varpulis:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        FEATURES: "saas,kafka,redis,persistent"
    container_name: varpulis-server
    command:
      - "server"
      - "--bind"
      - "0.0.0.0"
      - "--port"
      - "9000"
      - "--metrics"
      - "--api-key"
      - "${VARPULIS_API_KEY:-default-dev-key}"
    ports:
      - "9000:9000"
    expose:
      - "9090"
    environment:
      # Core
      - VARPULIS_API_KEY=${VARPULIS_API_KEY:-default-dev-key}
      - VARPULIS_RATE_LIMIT=${VARPULIS_RATE_LIMIT:-1000}
      - RUST_LOG=${RUST_LOG:-info}
      # Database (migrations run automatically on startup)
      - DATABASE_URL=postgresql://varpulis:${POSTGRES_PASSWORD}@postgres:5432/varpulis
      # GitHub OAuth
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in .env}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      # Stripe billing (optional — leave empty to disable)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}
      # URLs
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SERVER_URL=${SERVER_URL:-http://localhost:9000}
    volumes:
      - varpulis-data:/app/data
      - varpulis-state:/app/state
      - ./queries:/app/queries:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - varpulis-net

  # ─── Web UI (Vue SPA) ────────────────────────────────────────
  web-ui:
    build:
      context: ../../web-ui
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: "${VARPULIS_API_KEY:-default-dev-key}"
    container_name: varpulis-web-ui
    expose:
      - "8080"
    depends_on:
      varpulis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - varpulis-net

  # ─── Caddy (reverse proxy + TLS) ─────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: varpulis-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.saas:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web-ui:
        condition: service_healthy
      varpulis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - varpulis-net

  # ─── Prometheus (metrics) ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: varpulis-prometheus
    expose:
      - "9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - varpulis-net

  # ─── Grafana (dashboards) ────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: varpulis-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-varpulis}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - varpulis-net

volumes:
  postgres-data:
  varpulis-data:
  varpulis-state:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:

networks:
  varpulis-net:
    driver: bridge
