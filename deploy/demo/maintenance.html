<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varpulis – Updating</title>
  <meta http-equiv="refresh" content="15">
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #e2e8f0; --muted: #94a3b8; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh;
           display: flex; align-items: center; justify-content: center; }
    .card { background: var(--card); border-radius: 16px; padding: 3rem 2.5rem;
            max-width: 520px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    .logo { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; margin-bottom: .5rem; }
    .logo span { color: var(--accent); }
    .subtitle { color: var(--muted); margin-bottom: 2rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--card);
               border-top-color: var(--accent); border-radius: 50%;
               animation: spin 1s linear infinite; margin: 0 auto 1.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: .5rem; }
    .version { display: inline-block; background: var(--accent); color: var(--bg);
               border-radius: 6px; padding: .15rem .6rem; font-weight: 600;
               font-size: .9rem; margin-left: .25rem; }
    .note { color: var(--muted); font-size: .9rem; margin-top: 1.5rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>Varpulis</span> CEP</div>
    <p class="subtitle">Complex Event Processing Engine</p>
    <div class="spinner"></div>
    <h2>Deploying version <span class="version" id="ver"><!-- VERSION --></span></h2>
    <p class="note">
      The demo is being updated to a new version.<br>
      This page will auto-refresh when the update is complete.
    </p>
  </div>
</body>
</html>
