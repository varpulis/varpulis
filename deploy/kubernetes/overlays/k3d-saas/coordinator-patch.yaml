apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: varpulis-coordinator
  namespace: varpulis
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: coordinator
          args:
            - "coordinator"
            - "--port"
            - "9100"
            - "--bind"
            - "0.0.0.0"
            - "--api-key"
            - "k3d-saas-test-key"
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: varpulis-k3d-saas-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
