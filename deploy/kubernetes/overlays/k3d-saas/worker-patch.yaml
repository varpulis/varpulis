apiVersion: apps/v1
kind: Deployment
metadata:
  name: varpulis
  namespace: varpulis
spec:
  template:
    spec:
      containers:
        - name: varpulis
          args:
            - "server"
            - "--bind"
            - "0.0.0.0"
            - "--port"
            - "9000"
            - "--api-key"
            - "k3d-saas-test-key"
            - "--state-dir"
            - "/app/state"
            - "--metrics"
            - "--coordinator"
            - "http://varpulis-coordinator:9100"
            - "--worker-id"
            - "$(POD_NAME)"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VARPULIS_ADVERTISE_ADDRESS
              value: "http://$(POD_IP):9000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: varpulis-k3d-saas-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: varpulis-k3d-saas-secrets
                  key: jwt-secret
            - name: VARPULIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: varpulis-k3d-saas-secrets
                  key: admin-password
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: varpulis-k3d-saas-config
                  key: frontend-url
            - name: SMTP_HOST
              value: "mailpit"
            - name: SMTP_PORT
              value: "1025"
            - name: SMTP_FROM
              value: "noreply@varpulis.test"
            - name: RUST_LOG
              value: "info,varpulis=debug"
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
