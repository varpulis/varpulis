apiVersion: v1
kind: Service
metadata:
  name: varpulis
  namespace: varpulis
spec:
  type: NodePort
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      nodePort: 30900
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: varpulis-coordinator
  namespace: varpulis
spec:
  type: NodePort
  ports:
    - name: api
      port: 9100
      targetPort: api
      nodePort: 30100
      protocol: TCP
