# Varpulis Home Assistant Configuration
#
# Option 1: Add to your existing docker-compose.yml alongside Home Assistant
# Option 2: Run standalone with Docker
#
# Prerequisites:
#   - Home Assistant with MQTT integration enabled
#   - MQTT broker (Mosquitto add-on or external)
#   - Varpulis container image

# =============================================================================
# Docker Compose (add alongside your HA stack)
# =============================================================================
#
# services:
#   homeassistant:
#     image: ghcr.io/home-assistant/home-assistant:stable
#     volumes:
#       - ./ha-config:/config
#     network_mode: host
#     restart: unless-stopped
#
#   mosquitto:
#     image: eclipse-mosquitto:2
#     ports:
#       - "1883:1883"
