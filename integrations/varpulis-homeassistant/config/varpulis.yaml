# =============================================================================
# Standalone Docker Run (single recipe)
# =============================================================================
#
# docker run -d \
#   --name varpulis-ha \
#   -e MQTT_HOST=192.168.1.100 \
#   -e MQTT_PORT=1883 \
#   -v $(pwd)/recipes:/config/recipes \
#   ghcr.io/varpulis/varpulis:latest \
#   run --file /config/recipes/security-intrusion.vpl

# =============================================================================
# Home Assistant Webhook Configuration
# =============================================================================
#
# To receive Varpulis alerts in HA, create a webhook automation:
#
# automation:
#   - alias: "Varpulis Intrusion Alert"
#     trigger:
#       - platform: webhook
#         webhook_id: varpulis_intrusion
#         local_only: true
#     action:
#       - service: notify.mobile_app_your_phone
#         data:
#           title: "Security Alert"
#           message: "{{ trigger.json.message }}"
#           data:
#             priority: high
#             ttl: 0

# =============================================================================
# Home Assistant MQTT Configuration
# =============================================================================
#
# Ensure HA publishes state changes to MQTT. In configuration.yaml:
#
# mqtt:
#   broker: localhost
#   port: 1883
#   discovery: true
#
# For entity state publishing, use the MQTT Statestream integration:
#
# mqtt_statestream:
#   base_topic: homeassistant
#   publish_attributes: true
#   publish_timestamps: true
#   include:
#     entity_globs:
#       - binary_sensor.*_door
#       - binary_sensor.*_motion
#       - binary_sensor.*_water_leak
#       - sensor.*_temperature
#       - sensor.*_humidity
#       - sensor.*_power
#       - person.*
