# Minimal Redpanda stack for Kafka exactly-once crash-recovery tests.
# Based on benchmarks/arroyo-comparison/docker/docker-compose.yml.

services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: eo-test-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:29092
      - --pandaproxy-addr=0.0.0.0:8082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
    ports:
      - "29092:19092"
      - "28082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers redpanda:9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  default:
    name: eo-test-net
