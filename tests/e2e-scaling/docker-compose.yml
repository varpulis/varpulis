services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - varpulis-e2e

  # Coordinator consensus: leadership lease + compare-and-swap writes on a
  # JetStream KV bucket. One broker here (this is a scaling test, not a
  # control-plane durability test); a real deployment runs a NATS cluster with
  # VARPULIS_CONTROL_PLANE_REPLICAS=3.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    networks:
      - varpulis-e2e

  coordinator-1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        FEATURES: jetstream-control-plane
    command:
      - "coordinator"
      - "--port"
      - "9100"
      - "--bind"
      - "0.0.0.0"
      - "--heartbeat-interval"
      - "3"
      - "--heartbeat-timeout"
      - "10"
      - "--coordinator-id"
      - "coordinator-1"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9100/health"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 5
    environment:
      - VARPULIS_CONTROL_PLANE_URL=nats://nats:4222
      # One broker here on purpose: this compose tests horizontal scaling and
      # coordinator HA, not control-plane durability, and the coordinator
      # refuses by default to run on a bucket that cannot lose a broker.
      # A deployment must NOT set this — see deploy/demo for the real shape.
      - VARPULIS_CONTROL_PLANE_ALLOW_SINGLE_REPLICA=1
    depends_on:
      mosquitto:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - varpulis-e2e

  coordinator-2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        FEATURES: jetstream-control-plane
    command:
      - "coordinator"
      - "--port"
      - "9100"
      - "--bind"
      - "0.0.0.0"
      - "--heartbeat-interval"
      - "3"
      - "--heartbeat-timeout"
      - "10"
      - "--coordinator-id"
      - "coordinator-2"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9100/health"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 5
    environment:
      - VARPULIS_CONTROL_PLANE_URL=nats://nats:4222
      # One broker here on purpose: this compose tests horizontal scaling and
      # coordinator HA, not control-plane durability, and the coordinator
      # refuses by default to run on a bucket that cannot lose a broker.
      # A deployment must NOT set this — see deploy/demo for the real shape.
      - VARPULIS_CONTROL_PLANE_ALLOW_SINGLE_REPLICA=1
    depends_on:
      mosquitto:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - varpulis-e2e

  coordinator-3:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        FEATURES: jetstream-control-plane
    command:
      - "coordinator"
      - "--port"
      - "9100"
      - "--bind"
      - "0.0.0.0"
      - "--heartbeat-interval"
      - "3"
      - "--heartbeat-timeout"
      - "10"
      - "--coordinator-id"
      - "coordinator-3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9100/health"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 5
    environment:
      - VARPULIS_CONTROL_PLANE_URL=nats://nats:4222
      # One broker here on purpose: this compose tests horizontal scaling and
      # coordinator HA, not control-plane durability, and the coordinator
      # refuses by default to run on a bucket that cannot lose a broker.
      # A deployment must NOT set this — see deploy/demo for the real shape.
      - VARPULIS_CONTROL_PLANE_ALLOW_SINGLE_REPLICA=1
    depends_on:
      mosquitto:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - varpulis-e2e

  worker-1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        FEATURES: jetstream-control-plane
    command:
      - "server"
      - "--port"
      - "9000"
      - "--bind"
      - "0.0.0.0"
      - "--coordinator"
      - "http://coordinator-1:9100"
      - "--worker-id"
      - "worker-1"
      - "--advertise-address"
      - "http://worker-1:9000"
      - "--api-key"
      - "e2e-test-key"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      coordinator-1:
        condition: service_healthy
    networks:
      - varpulis-e2e

  worker-2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        FEATURES: jetstream-control-plane
    command:
      - "server"
      - "--port"
      - "9000"
      - "--bind"
      - "0.0.0.0"
      - "--coordinator"
      - "http://coordinator-1:9100"
      - "--worker-id"
      - "worker-2"
      - "--advertise-address"
      - "http://worker-2:9000"
      - "--api-key"
      - "e2e-test-key"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      coordinator-1:
        condition: service_healthy
    networks:
      - varpulis-e2e

  worker-3:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        FEATURES: jetstream-control-plane
    command:
      - "server"
      - "--port"
      - "9000"
      - "--bind"
      - "0.0.0.0"
      - "--coordinator"
      - "http://coordinator-2:9100"
      - "--worker-id"
      - "worker-3"
      - "--advertise-address"
      - "http://worker-3:9000"
      - "--api-key"
      - "e2e-test-key"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      coordinator-2:
        condition: service_healthy
    networks:
      - varpulis-e2e

  worker-4:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        FEATURES: jetstream-control-plane
    command:
      - "server"
      - "--port"
      - "9000"
      - "--bind"
      - "0.0.0.0"
      - "--coordinator"
      - "http://coordinator-3:9100"
      - "--worker-id"
      - "worker-4"
      - "--advertise-address"
      - "http://worker-4:9000"
      - "--api-key"
      - "e2e-test-key"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      coordinator-3:
        condition: service_healthy
    networks:
      - varpulis-e2e

  test-driver:
    build:
      context: .
      dockerfile: Dockerfile.test-driver
    environment:
      COORDINATOR_URL: http://coordinator-1:9100
      COORDINATOR_2_URL: http://coordinator-2:9100
      COORDINATOR_3_URL: http://coordinator-3:9100
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
      worker-3:
        condition: service_healthy
      worker-4:
        condition: service_healthy
    networks:
      - varpulis-e2e

networks:
  varpulis-e2e:
    driver: bridge
