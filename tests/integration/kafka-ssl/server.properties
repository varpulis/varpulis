broker.id=1
zookeeper.connect=zookeeper-ssl:2181

# Listeners
listener.security.protocol.map=EXTERNAL:SASL_SSL,INTERNAL:PLAINTEXT
listeners=EXTERNAL://0.0.0.0:9093,INTERNAL://0.0.0.0:29093
advertised.listeners=EXTERNAL://localhost:9093,INTERNAL://kafka:29093
inter.broker.listener.name=INTERNAL

# SASL — only on EXTERNAL listener
sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.external.sasl.enabled.mechanisms=SCRAM-SHA-512

# SSL
ssl.keystore.location=/etc/kafka/secrets/broker-keystore.p12
ssl.keystore.password=test-password
ssl.key.password=test-password
ssl.keystore.type=PKCS12
ssl.truststore.location=/etc/kafka/secrets/truststore.p12
ssl.truststore.password=test-password
ssl.truststore.type=PKCS12
ssl.client.auth=requested
ssl.endpoint.identification.algorithm=

# Topic defaults
offsets.topic.replication.factor=1
transaction.state.log.min.isr=1
transaction.state.log.replication.factor=1
auto.create.topics.enable=true
group.initial.rebalance.delay.ms=0

# Log dirs
log.dirs=/var/lib/kafka/data
num.partitions=1
