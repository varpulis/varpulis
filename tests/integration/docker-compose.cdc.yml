services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: varpulis-cdc-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: varpulis
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: cdc_test
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "varpulis", "-d", "cdc_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-setup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command: |
      "
      echo 'Creating CDC test tables...'
      PGPASSWORD=testpass psql -h postgres -U varpulis -d cdc_test -c '
        CREATE TABLE IF NOT EXISTS orders (
          id SERIAL PRIMARY KEY,
          customer TEXT NOT NULL,
          amount NUMERIC(10,2) NOT NULL,
          status TEXT DEFAULT '\''pending'\''
        );
        CREATE TABLE IF NOT EXISTS products (
          id SERIAL PRIMARY KEY,
          name TEXT NOT NULL,
          price NUMERIC(10,2) NOT NULL,
          stock INTEGER DEFAULT 0
        );
        CREATE PUBLICATION varpulis_pub FOR TABLE orders, products;
      '
      echo 'Tables and publication created:'
      PGPASSWORD=testpass psql -h postgres -U varpulis -d cdc_test -c '\dt'
      PGPASSWORD=testpass psql -h postgres -U varpulis -d cdc_test -c 'SELECT * FROM pg_publication;'
      "

networks:
  default:
    driver: bridge
