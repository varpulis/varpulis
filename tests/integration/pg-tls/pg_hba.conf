# TLS-ONLY host-based auth for the CDC TLS test fixture.
#
# There is deliberately NO plain `host` line: a non-TLS TCP connection is
# rejected outright, so `sslmode=require` can only succeed by negotiating real
# TLS. That is what makes sslmode_require_negotiates_real_tls a genuine gate
# rather than a connectivity smoke test.
local   all             all                                     trust
hostssl all             all             0.0.0.0/0               trust
hostssl all             all             ::/0                    trust
