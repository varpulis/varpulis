    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Varpulis an Apache Flink alternative?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Varpulis is an open-source Rust stream processing engine designed as a lightweight Apache Flink alternative. It runs as a single 15MB binary with no JVM and delivers 1.5M events per second per core. Unlike Flink CEP, it has native pattern detection, forecasting, and multi-query optimization built in."
            }
          },
          {
            "@type": "Question",
            "name": "What does Varpulis do?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Varpulis detects patterns across real-time event streams — sequences, Kleene closures, negation, temporal windows. It is used for detection engineering, fraud prevention, MITRE ATT&CK kill chain detection, and real-time anomaly detection. Detections are written as declarative VPL programs and deployed as a single binary."
            }
          },
          {
            "@type": "Question",
            "name": "Does Varpulis run without a JVM?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Varpulis is written in Rust and compiles to a single native binary (~15MB). No JVM, no cluster, no Zookeeper. It runs as a CLI, a server, or an embedded library, and scales horizontally via built-in clustering."
            }
          },
          {
            "@type": "Question",
            "name": "Can Varpulis detect MITRE ATT&CK kill chains?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Varpulis is built for detection engineering. It detects multi-step attack sequences that single-event SIEM rules miss — behavioral patterns that catch what signature rules can't, even when attackers rename tools or change C2 infrastructure. It has been validated against real MITRE ATT&CK datasets at 25K+ events per second."
            }
          },
          {
            "@type": "Question",
            "name": "How is Varpulis different from Timeplus Proton or Arroyo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Timeplus Proton and Arroyo are excellent general-purpose stream processing engines focused on streaming SQL and analytics. Varpulis specializes in real-time pattern detection — temporal sequences, Kleene closures, forecasting, and multi-query optimization via graphlet sharing. Use Proton or Arroyo for streaming ETL and analytics; use Varpulis when you need to detect complex event patterns in real time."
            }
          }
        ]
