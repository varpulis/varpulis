[package]
name = "varpulis-connector-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Redis connector for Varpulis CEP engine"

[dependencies]
varpulis-connector-api = { version = "0.7.0", path = "../varpulis-connector-api" }
varpulis-core = { version = "0.7.0", path = "../varpulis-core" }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
futures-util = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

