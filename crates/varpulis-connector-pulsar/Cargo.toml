[package]
name = "varpulis-connector-pulsar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Apache Pulsar connector for Varpulis CEP engine"

[dependencies]
varpulis-connector-api = { version = "0.8.0", path = "../varpulis-connector-api" }
varpulis-core = { version = "0.8.0", path = "../varpulis-core" }
pulsar = { version = "6", features = ["tokio-runtime"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
futures-util = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
