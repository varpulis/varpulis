[package]
name = "varpulis-enrichment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "External connector enrichment providers for VPL streams"

[dependencies]
varpulis-core = { version = "0.11.0", path = "../varpulis-core" }
varpulis-connectors = { version = "0.11.0", path = "../varpulis-connectors" }
async-trait = "0.1"
reqwest = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }

# Optional enrichment providers
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "postgres", "mysql", "sqlite"], optional = true }
redis = { version = "1", features = ["tokio-comp", "connection-manager"], optional = true }

[features]
default = []
database = ["sqlx", "varpulis-connectors/database"]
redis = ["dep:redis", "varpulis-connectors/redis"]

[lints]
workspace = true
