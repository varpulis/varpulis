[package]
name = "varpulis-connector-kinesis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "AWS Kinesis connector for Varpulis CEP engine"

[dependencies]
varpulis-connector-api = { version = "0.7.0", path = "../varpulis-connector-api" }
varpulis-core = { version = "0.7.0", path = "../varpulis-core" }
aws-config = "1.8"
aws-sdk-kinesis = "1.101"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
