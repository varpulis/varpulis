[package]
name = "varpulis-connector-kinesis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "AWS Kinesis connector for Varpulis CEP engine"

[dependencies]
varpulis-connector-api = { version = "0.11.0", path = "../varpulis-connector-api" }
varpulis-core = { version = "0.11.0", path = "../varpulis-core" }
aws-config = "1.8"
# `default-features = false` drops the SDK's `rustls` feature, which pulls in the
# legacy hyper 0.14 / h2 0.3 client (RUSTSEC-2026-0258 has no fix on the h2 0.3
# line). HTTPS still goes through `default-https-client` (hyper 1.x + rustls),
# which is the client the SDK selects at runtime anyway.
aws-sdk-kinesis = { version = "1.103", default-features = false, features = ["default-https-client", "rt-tokio"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
