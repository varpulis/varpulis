[package]
name = "varpulis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rust stream processing engine for real-time detection. Apache Flink alternative for detection engineering, fraud prevention, and MITRE ATT&CK coverage. 1.5M events/sec, single 15MB binary, no JVM. Install: cargo install varpulis-cli"
readme = "../../README.md"
keywords = ["stream-processing", "detection", "pattern-matching", "streaming", "observability"]
categories = ["command-line-utilities", "science", "development-tools"]

# This is a meta-crate for crates.io discoverability.
# The actual CLI binary is `varpulis-cli`:
#   cargo install varpulis-cli

[lib]
name = "varpulis"
path = "src/lib.rs"

[dependencies]
varpulis-core = { version = "0.10.0", path = "../varpulis-core" }
varpulis-runtime = { version = "0.10.0", path = "../varpulis-runtime" }
