[package]
name = "varpulis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "The varpulis command: check, parse and simulate VPL programs with the Varpulis CEP engine"
readme = "README.md"

[[bin]]
name = "varpulis"
path = "src/main.rs"

[dependencies]
varpulis-engine = { version = "0.11.0", path = "../varpulis-engine" }
varpulis-parser = { version = "0.11.0", path = "../varpulis-parser" }
varpulis-runtime = { version = "0.11.0", path = "../varpulis-runtime", default-features = false }
clap = { workspace = true }

[lints]
workspace = true
