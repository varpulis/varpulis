[package]
name = "varpulis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for Varpulis streaming analytics engine"

[lib]
name = "varpulis_cli"
path = "src/lib.rs"

[[bin]]
name = "varpulis"
path = "src/main.rs"

[dependencies]
varpulis-core = { version = "0.6.1", path = "../varpulis-core" }
varpulis-parser = { version = "0.6.1", path = "../varpulis-parser" }
varpulis-runtime = { version = "0.6.1", path = "../varpulis-runtime", features = ["mqtt"] }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
axum-server = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
rand = { workspace = true }
rayon = "1.10"
serde_yaml = "0.9"
toml = "1"
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }
reqwest = { workspace = true }
async-trait = "0.1"
varpulis-cluster = { version = "0.6.1", path = "../varpulis-cluster" }
varpulis-datagen = { version = "0.6.1", path = "../varpulis-datagen" }
jsonwebtoken = { workspace = true }
urlencoding = "2"
bytes = "1"
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
argon2 = "0.5"
getrandom = "0.4"
varpulis-connectors = { version = "0.6.1", path = "../varpulis-connectors" }

# OIDC/SSO (optional, behind "oidc" feature)
openidconnect = { version = "4", optional = true }

# SaaS layer (optional, behind "saas" feature)
varpulis-db = { version = "0.6.1", path = "../varpulis-db", optional = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"], optional = true }

# OpenTelemetry (optional, behind "otel" feature)
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[features]
default = []
kafka = ["varpulis-runtime/kafka"]
nats-transport = ["varpulis-cluster/nats-transport"]
onnx = ["varpulis-runtime/onnx"]
k8s = ["varpulis-cluster/k8s"]
raft = ["varpulis-cluster/raft"]
persistent = ["raft", "varpulis-cluster/persistent"]
saas = ["varpulis-db", "lettre"]
oidc = ["openidconnect"]
encryption = ["varpulis-connectors/encryption"]
otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry", "varpulis-cluster/otel"]

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
