[package]
name = "varpulis-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bindings for VPL parser and validator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
varpulis-core = { version = "0.4.1", path = "../varpulis-core" }
varpulis-parser = { version = "0.4.1", path = "../varpulis-parser" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
