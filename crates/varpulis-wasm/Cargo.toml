[package]
name = "varpulis-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "WASM bindings for VPL parser and validator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
varpulis-core = { version = "0.8.0", path = "../varpulis-core" }
varpulis-parser = { version = "0.8.0", path = "../varpulis-parser" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"

# SmartModule host runtime (native targets only)
wasmtime = { version = "42", optional = true }
thiserror = { workspace = true, optional = true }

[features]
default = []
smartmodule = ["wasmtime", "thiserror"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
