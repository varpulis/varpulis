[package]
name = "varpulis-cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Distributed execution cluster for Varpulis streaming analytics"

[dependencies]
varpulis-core = { version = "0.8.0", path = "../varpulis-core" }
varpulis-runtime = { version = "0.8.0", path = "../varpulis-runtime", features = ["mqtt"] }
varpulis-parser = { version = "0.8.0", path = "../varpulis-parser" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { workspace = true }
prometheus = { workspace = true }
zeroize = { workspace = true }
base64 = "0.22"
jsonwebtoken = { workspace = true }

[dependencies.async-nats]
version = "0.46"
optional = true

[dependencies.opentelemetry]
workspace = true
optional = true

[dependencies.tracing-opentelemetry]
workspace = true
optional = true

[dependencies.futures-util]
workspace = true
optional = true

[features]
default = []
k8s = ["kube", "k8s-openapi", "futures-util"]
onnx = ["varpulis-runtime/onnx"]
raft = ["openraft"]
persistent = ["raft", "rocksdb"]
nats-transport = ["async-nats", "futures-util"]
federation = ["nats-transport"]
otel = ["opentelemetry", "tracing-opentelemetry"]

[dependencies.kube]
version = "3"
features = ["runtime", "client"]
optional = true

[dependencies.k8s-openapi]
version = "0.27"
features = ["v1_33"]
optional = true

[dependencies.openraft]
version = "0.9"
features = ["serde"]
optional = true

[dependencies.rocksdb]
version = "0.24"
optional = true

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
async-nats = "0.46"
futures-util = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
serde_json = { workspace = true }
rand = { workspace = true }

[lints]
workspace = true
