indexmap = { workspace = true }
rustc-hash = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
miette = { workspace = true }

[dev-dependencies]
varpulis-parser = { path = "../varpulis-parser" }
serde_json = { workspace = true }

[lints]
workspace = true
