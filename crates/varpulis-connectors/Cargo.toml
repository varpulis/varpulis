[package]
name = "varpulis-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Connector implementations for Varpulis (MQTT, Kafka, NATS, HTTP, etc.)"

[dependencies]
varpulis-core = { version = "0.5.0", path = "../varpulis-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
inventory = { workspace = true }
async-trait = "0.1"
futures-util = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
uuid = { version = "1", features = ["v4"] }

# Optional connectors
rumqttc = { version = "0.25", optional = true }
rdkafka = { version = "0.39", features = ["cmake-build"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "postgres", "mysql", "sqlite"], optional = true }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"], optional = true }
async-nats = { version = "0.38", optional = true }

# AWS connectors
aws-config = { version = "1.5", optional = true }
aws-sdk-kinesis = { version = "1.54", optional = true }
aws-sdk-s3 = { version = "1.68", optional = true }

# PostgreSQL CDC (logical replication)
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"], optional = true }

# Elasticsearch
elasticsearch = { version = "8.15.0-alpha.1", optional = true }

# Apache Pulsar
pulsar = { version = "6", features = ["tokio-runtime"], optional = true }

[features]
default = []
mqtt = ["rumqttc"]
kafka = ["rdkafka"]
postgres = ["sqlx"]
mysql = ["sqlx"]
sqlite = ["sqlx"]
database = ["sqlx"]
redis = ["dep:redis"]
kinesis = ["aws-config", "aws-sdk-kinesis"]
s3 = ["aws-config", "aws-sdk-s3"]
nats = ["async-nats"]
elasticsearch = ["dep:elasticsearch"]
pulsar = ["dep:pulsar"]
cdc = ["tokio-postgres"]
csv-converter = []
all-connectors = ["mqtt", "kafka", "nats", "database", "redis", "kinesis", "s3", "elasticsearch", "pulsar"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
