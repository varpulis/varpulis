[package]
name = "varpulis-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Language Server Protocol implementation for VPL"

[lib]
name = "varpulis_lsp"
path = "src/lib.rs"

[[bin]]
name = "varpulis-lsp"
path = "src/main.rs"

[dependencies]
# LSP (use tower-lsp's re-exported lsp-types to avoid version mismatch)
tower-lsp = "0.20"

# Async runtime
tokio = { workspace = true }

# Varpulis crates
varpulis-parser = { version = "0.6.1", path = "../varpulis-parser" }
varpulis-core = { version = "0.6.1", path = "../varpulis-core" }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
dashmap = "6"

[lints]
workspace = true
