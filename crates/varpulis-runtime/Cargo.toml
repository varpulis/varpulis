[package]
name = "varpulis-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Runtime execution engine for Varpulis — Rust stream processing with pattern matching, forecasting, and real-time detection."
keywords = ["stream-processing", "streaming", "runtime", "real-time", "detection"]
categories = ["science", "development-tools", "data-structures"]

[dependencies]
varpulis-core = { version = "0.10.0", path = "../varpulis-core" }
varpulis-parser = { version = "0.10.0", path = "../varpulis-parser" }
varpulis-sase = { version = "0.10.0", path = "../varpulis-sase" }
varpulis-zdd = { version = "0.10.0", path = "../varpulis-zdd" }
varpulis-pst = { version = "0.10.0", path = "../varpulis-pst" }
varpulis-hamlet = { version = "0.10.0", path = "../varpulis-hamlet" }
varpulis-simd = { version = "0.10.0", path = "../varpulis-simd" }
varpulis-dead-letter = { version = "0.10.0", path = "../varpulis-dead-letter" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true }
rand = { workspace = true }
rustc-hash = { workspace = true }
smallvec = "1.13"
hashlink = "0.11"
sha2 = { workspace = true }
hex = { workspace = true }

# async-runtime: dependencies that require a tokio async runtime (not WASM-compatible)
varpulis-connectors = { version = "0.10.0", path = "../varpulis-connectors", optional = true }
varpulis-enrichment = { version = "0.10.0", path = "../varpulis-enrichment", optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
rayon = { version = "1.10", optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
core_affinity = { version = "0.8", optional = true }

# ONNX Runtime — no stable 2.x exists (all versions are RC); pinned for reproducibility
ort = { version = "=2.0.0-rc.12", features = ["load-dynamic"], optional = true }

# State persistence
rocksdb = { version = "0.24", optional = true }

# S3 state store
aws-config = { version = "1.8", optional = true }
aws-sdk-s3 = { version = "1.124", optional = true }
zstd = { version = "0.13", optional = true }

# Apache Arrow columnar processing
arrow-array = { version = "58", optional = true, default-features = false }
arrow-schema = { version = "58", optional = true, default-features = false }
arrow-arith = { version = "58", optional = true, default-features = false }
# arrow-row: SIMD-friendly comparison encoding for multi-column group keys.
# Used by the streaming columnar grouped aggregator to hash partition keys
# in bulk, the same way DataFusion's GroupedHashAggregateStream does.
arrow-row = { version = "58", optional = true, default-features = false }

# Encryption at rest
aes-gcm = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }

# Binary serialization
rmp-serde = { version = "1.3", optional = true }

# WASM UDF support
varpulis-wasm = { version = "0.10.0", path = "../varpulis-wasm", optional = true, features = ["smartmodule"] }

# Event generation for interactive mode
varpulis-datagen = { version = "0.10.0", path = "../varpulis-datagen", optional = true }

[features]
# `arrow` is in default so the release binary and web-ui preview mode get
# the streaming columnar aggregation fast path automatically. WASM builds
# must pass `--no-default-features --features wasm` (already the documented
# way to build for wasm32-unknown-unknown); the `wasm` feature set does NOT
# enable `arrow`, keeping the sync-only build path lean.
default = ["async-runtime", "arrow"]
# Full async runtime with tokio, connectors, metrics, and all async infrastructure.
# Disable this (use --no-default-features) for WASM or pure-sync builds.
async-runtime = [
    "tokio", "reqwest", "prometheus", "async-trait", "rayon", "futures",
    "uuid", "core_affinity",
    "varpulis-connectors", "varpulis-enrichment",
]
# Pure synchronous engine for wasm32-unknown-unknown. No tokio, no connectors.
wasm = []
mqtt = ["varpulis-connectors/mqtt", "async-runtime"]
kafka = ["varpulis-connectors/kafka", "async-runtime"]
postgres = ["varpulis-connectors/postgres", "async-runtime"]
mysql = ["varpulis-connectors/mysql", "async-runtime"]
sqlite = ["varpulis-connectors/sqlite", "async-runtime"]
database = ["varpulis-connectors/database", "varpulis-enrichment/database", "async-runtime"]
redis = ["varpulis-connectors/redis", "varpulis-enrichment/redis", "async-runtime"]
persistence = ["rocksdb"]
s3-state = ["aws-config", "aws-sdk-s3", "async-runtime"]
checkpoint-compression = ["zstd"]
kinesis = ["varpulis-connectors/kinesis", "async-runtime"]
s3 = ["varpulis-connectors/s3", "async-runtime"]
nats = ["varpulis-connectors/nats", "async-runtime"]
elasticsearch = ["varpulis-connectors/elasticsearch", "async-runtime"]
pulsar = ["varpulis-connectors/pulsar", "async-runtime"]
arrow = ["arrow-array", "arrow-schema", "arrow-arith", "arrow-row"]
onnx = ["ort"]
gpu = ["onnx"]
binary-codec = ["rmp-serde"]
encryption = ["aes-gcm", "argon2"]
cdc = ["varpulis-connectors/cdc", "async-runtime"]
csv-converter = ["varpulis-connectors/csv-converter", "async-runtime"]
wasm-udf = ["varpulis-wasm"]
interactive = ["varpulis-datagen", "async-runtime"]
all-connectors = ["mqtt", "kafka", "nats", "database", "redis", "kinesis", "s3", "elasticsearch", "pulsar"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.10"
pprof = { version = "0.14", features = ["flamegraph"] }
async-nats = "0.46"
rumqttc = { package = "rumqttc-v4-next", version = "0.28" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = { version = "0.7" }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
insta = { workspace = true }

[[bench]]
name = "pattern_benchmark"
harness = false

[[bench]]
name = "imperative_benchmark"
harness = false

[[bench]]
name = "comparison_benchmark"
harness = false

[[bench]]
name = "kleene_benchmark"
harness = false

[[bench]]
name = "context_benchmark"
harness = false

[[bench]]
name = "hamlet_zdd_benchmark"
harness = false

[[bench]]
name = "pst_forecast_benchmark"
harness = false

[[bench]]
name = "eventflux_comparison"
harness = false

[[bench]]
name = "cdc_benchmark"
harness = false
required-features = ["cdc"]

[[bench]]
name = "columnar_agg_benchmark"
harness = false
required-features = ["arrow"]

[[bench]]
name = "dispatch_benchmark"
harness = false

[lints]
workspace = true

