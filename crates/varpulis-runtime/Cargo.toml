[package]
name = "varpulis-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime execution engine for Varpulis"

[dependencies]
varpulis-connectors = { version = "0.6.1", path = "../varpulis-connectors" }
varpulis-core = { version = "0.6.1", path = "../varpulis-core" }
varpulis-parser = { version = "0.6.1", path = "../varpulis-parser" }
varpulis-sase = { version = "0.6.1", path = "../varpulis-sase" }
varpulis-zdd = { version = "0.6.1", path = "../varpulis-zdd" }
varpulis-pst = { version = "0.6.1", path = "../varpulis-pst" }
varpulis-hamlet = { version = "0.6.1", path = "../varpulis-hamlet" }
varpulis-enrichment = { version = "0.6.1", path = "../varpulis-enrichment" }
varpulis-simd = { version = "0.6.1", path = "../varpulis-simd" }
varpulis-dead-letter = { version = "0.6.1", path = "../varpulis-dead-letter" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true }
rand = { workspace = true }
prometheus = { workspace = true }
rustc-hash = { workspace = true }
async-trait = "0.1"
rayon = "1.10"
smallvec = "1.13"
hashlink = "0.11"
reqwest = { workspace = true }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = { workspace = true }
hex = { workspace = true }
core_affinity = "0.8"

# ONNX Runtime — no stable 2.x exists (all versions are RC); pinned for reproducibility
ort = { version = "=2.0.0-rc.11", features = ["load-dynamic"], optional = true }

# State persistence
rocksdb = { version = "0.24", optional = true }

# Encryption at rest
aes-gcm = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }

# Binary serialization
rmp-serde = { version = "1.3", optional = true }

[features]
default = []
mqtt = ["varpulis-connectors/mqtt"]
kafka = ["varpulis-connectors/kafka"]
postgres = ["varpulis-connectors/postgres"]
mysql = ["varpulis-connectors/mysql"]
sqlite = ["varpulis-connectors/sqlite"]
database = ["varpulis-connectors/database", "varpulis-enrichment/database"]
redis = ["varpulis-connectors/redis", "varpulis-enrichment/redis"]
persistence = ["rocksdb"]
kinesis = ["varpulis-connectors/kinesis"]
s3 = ["varpulis-connectors/s3"]
nats = ["varpulis-connectors/nats"]
elasticsearch = ["varpulis-connectors/elasticsearch"]
pulsar = ["varpulis-connectors/pulsar"]
onnx = ["ort"]
gpu = ["onnx"]
binary-codec = ["rmp-serde"]
encryption = ["aes-gcm", "argon2"]
cdc = ["varpulis-connectors/cdc"]
csv-converter = ["varpulis-connectors/csv-converter"]
all-connectors = ["mqtt", "kafka", "nats", "database", "redis", "kinesis", "s3", "elasticsearch", "pulsar"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.10"
async-nats = "0.46"
rumqttc = "0.25"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = { version = "0.7" }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
insta = { workspace = true }

[[bench]]
name = "pattern_benchmark"
harness = false

[[bench]]
name = "imperative_benchmark"
harness = false

[[bench]]
name = "comparison_benchmark"
harness = false

[[bench]]
name = "kleene_benchmark"
harness = false

[[bench]]
name = "context_benchmark"
harness = false

[[bench]]
name = "hamlet_zdd_benchmark"
harness = false

[[bench]]
name = "pst_forecast_benchmark"
harness = false

[[bench]]
name = "eventflux_comparison"
harness = false

[[bench]]
name = "cdc_benchmark"
harness = false
required-features = ["cdc"]

[lints]
workspace = true

