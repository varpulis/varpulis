[package]
name = "varpulis-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "MCP server exposing Varpulis CEP engine to AI agents"

[[bin]]
name = "varpulis-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.1", features = ["server", "transport-io", "macros"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
schemars = "1"
varpulis-parser = { version = "0.6.1", path = "../varpulis-parser" }
varpulis-core = { version = "0.6.1", path = "../varpulis-core" }

[dev-dependencies]
pretty_assertions = { workspace = true }
rmcp = { version = "1.1", features = ["client", "transport-child-process"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
