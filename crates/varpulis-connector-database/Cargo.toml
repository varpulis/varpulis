[package]
name = "varpulis-connector-database"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Database connector (PostgreSQL, MySQL, SQLite) for Varpulis CEP engine"

[dependencies]
varpulis-connector-api = { version = "0.8.0", path = "../varpulis-connector-api" }
varpulis-core = { version = "0.8.0", path = "../varpulis-core" }
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "postgres", "mysql", "sqlite"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
