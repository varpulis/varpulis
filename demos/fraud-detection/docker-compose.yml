version: "3.8"

services:
  # Varpulis CEP engine
  varpulis:
    image: ghcr.io/varpulis/varpulis:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    command: >
      server --port 9000 --bind 0.0.0.0
    ports:
      - "9000:9000"
    volumes:
      - ./fraud_pipeline.vpl:/app/pipeline.vpl:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Event generator — produces fraud transactions
  generator:
    image: ghcr.io/varpulis/varpulis:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    command: >
      generate --schema fraud --rate 100 --duration 300s --seed 42
    depends_on:
      varpulis:
        condition: service_healthy

  # Grafana for dashboard visualization
  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
